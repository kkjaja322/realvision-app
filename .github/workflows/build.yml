name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor/splash-screen@^6.0.0
          npm install -D @capacitor/cli@^6.0.0

      - name: Write capacitor.config.json (local shell first, no direct server.url)
        run: |
          cat > capacitor.config.json << 'CAPEOF'
          {
            "appId": "com.realvisionacademy.app",
            "appName": "RealVision Academy",
            "webDir": "www",
            "server": {
              "cleartext": false,
              "androidScheme": "https",
              "allowNavigation": [
                "realvisionacademy.site.je",
                "*.realvisionacademy.site.je"
              ]
            },
            "android": {
              "allowMixedContent": false
            }
          }
          CAPEOF

      - name: Create local gateway shell (www/index.html)
        run: |
          mkdir -p www
          # Bug fix (round 2): this used to redirect to "/" (and, in an
          # earlier attempt, to "/index"). Both are wrong for the same
          # underlying reason: index.php is the PUBLIC guest landing page —
          # it always shows the "Login" button/marketing home, even for an
          # already-logged-in student, because it's not the app's real
          # per-student home. The actual home lives at one of 4 dept-scoped
          # entry files (natural_dashboard.php / social_dashboard.php /
          # freshman_dashboard.php / other_dashboard.php), each of which
          # starts with: if (!isLoggedIn()) redirect to /index; else if
          # wrong department, redirect to the correct dept dashboard. That
          # makes any one of them a self-correcting router. We use
          # "/other_dashboard" here for exactly that: a guest lands on
          # /index as normal, but an already-logged-in student (any
          # department) is auto-redirected server-side straight to their
          # real dashboard — so the offline cache captured under this URL
          # always reflects "am I logged in, and as whom" correctly,
          # instead of permanently showing the guest/login screen.
          # This is what the WebView loads on EVERY cold start — bundled inside
          # the APK, so it needs zero network to display. It just hands off
          # immediately to the live URL; MainActivity.java's custom
          # WebViewClient.shouldInterceptRequest (feature 39) is what actually
          # decides, per navigation, whether to fetch live or serve the native
          # offline cache — so this file only needs to exist and redirect, not
          # contain any connectivity logic itself.
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="am">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <meta http-equiv="refresh" content="0; url=https://realvisionacademy.site.je/other_dashboard">
          <title>RealVision Academy</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            html, body { height: 100%; background: #0f172a; color: #f1f5f9; font-family: -apple-system, Roboto, "Noto Sans Ethiopic", "Nyala", sans-serif; }
            #wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; }
            .logo { width: 84px; height: 84px; border-radius: 20px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(59,130,246,0.35); }
            h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
            p.sub { color: #94a3b8; font-size: 14px; max-width: 320px; line-height: 1.6; }
            .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #1e293b; border-top-color: #3b82f6; animation: spin 0.8s linear infinite; margin: 14px 0; }
            @keyframes spin { to { transform: rotate(360deg); } }
          </style>
          </head>
          <body>
          <div id="wrap">
            <div class="logo">🎓</div>
            <h1>RealVision Academy</h1>
            <div class="spinner"></div>
            <p class="sub">በመገናኘት ላይ... / Connecting...</p>
          </div>
          <script>
            window.location.replace('https://realvisionacademy.site.je/other_dashboard');
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write full MainActivity.java (35+ native features)
        run: |
          FILE=$(find android -name MainActivity.java)
          PKG_LINE=$(head -n 1 "$FILE")
          cat > "$FILE" << JAVAEOF
          $PKG_LINE

          import android.app.AlertDialog;
          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkInfo;
          import android.net.NetworkRequest;
          import android.net.Uri;
          import android.provider.Settings;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Vibrator;
          import android.os.VibrationEffect;
          import android.view.Gravity;
          import android.view.GestureDetector;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.animation.DecelerateInterpolator;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.List;
          import java.util.Map;

          public class MainActivity extends BridgeActivity {

              private boolean doubleBackToExitPressedOnce = false;
              private final Handler exitHandler = new Handler();
              private final Handler bannerHandler = new Handler(Looper.getMainLooper());
              private TextView networkBanner;
              private ProgressBar topProgressBar;
              private ValueAnimator progressAnimator;
              private ConnectivityManager.NetworkCallback networkCallback;
              private final Handler connectivityHandler = new Handler(Looper.getMainLooper());
              private boolean vpnDialogShowing = false;
              // Backing signal for feature 43 below — refreshed by checkRealInternet()
              // (on launch, every 10s, and on every network change), so it's more reliable
              // than the instantaneous isNetworkAvailable() check alone (that one only knows
              // "connected to a network", not "that network actually reaches the internet").
              private volatile boolean hasRealInternetSignal = true;
              private final Runnable periodicConnectivityCheck = new Runnable() {
                  @Override
                  public void run() {
                      checkRealInternet();
                      connectivityHandler.postDelayed(this, 10000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      // 1-2: Screenshot + screen recording block
                      getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                      );
                      // 3: Keep screen on
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                      WebView webView = this.bridge.getWebView();
                      if (webView != null) {
                          WebSettings settings = webView.getSettings();

                          // 4-5: Zoom disable
                          settings.setSupportZoom(false);
                          settings.setBuiltInZoomControls(false);
                          settings.setDisplayZoomControls(false);

                          // 6-7: Storage + JS
                          settings.setDomStorageEnabled(true);
                          settings.setJavaScriptEnabled(true);

                          // 8: Cache
                          settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                          // 9: Mixed content block (HTTPS only)
                          settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                          // 10: Custom user agent
                          String ua = settings.getUserAgentString();
                          settings.setUserAgentString(ua + " RealVisionApp/1.0");

                          // 11-12: Long-press / text-select disable
                          webView.setLongClickable(false);
                          webView.setHapticFeedbackEnabled(false);
                          webView.setOnLongClickListener(v -> true);

                          // 13: Overscroll/bounce disable
                          webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);

                          // 14: Text zoom lock
                          settings.setTextZoom(100);

                          // 15: Cookies persist
                          CookieManager.getInstance().setAcceptCookie(true);
                          CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                          // 16: Disable WebView debugging in production
                          WebView.setWebContentsDebuggingEnabled(false);

                          // 17: Safe browsing
                          settings.setSafeBrowsingEnabled(true);

                          // 18: Render priority
                          settings.setRenderPriority(WebSettings.RenderPriority.HIGH);

                          // 35: Native share bridge — call from web page via AndroidShare.shareText("...")
                          webView.addJavascriptInterface(new WebAppInterface(), "AndroidShare");

                          // 40: Chrome-style top loading bar — shown on onPageStarted / hidden on
                          // onPageFinished below (added to the same WebViewClient override, next
                          // to feature 39, so a single navigation callback drives both).
                          setupTopProgressBar();

                          // 41: Double-tap anywhere on the page to refresh. Safe to bind directly
                          // to touch events because zoom is disabled (settings.setSupportZoom
                          // above), so there's no native double-tap-to-zoom gesture to collide with.
                          GestureDetector doubleTapDetector = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                              @Override
                              public boolean onDoubleTap(MotionEvent e) {
                                  webView.reload();
                                  vibrateShort();
                                  return true;
                              }

                              // 42: Edge swipe-back — a left-edge-to-right fling (like iOS/Android
                              // system back gesture) goes back in WebView history, e.g.
                              // question_bank -> dashboard. Restricted to swipes that START near
                              // the left edge, so it never fires from a normal horizontal swipe
                              // happening elsewhere inside the page content.
                              @Override
                              public boolean onFling(MotionEvent e1, MotionEvent e2, float velocityX, float velocityY) {
                                  if (e1 == null) return false;
                                  float density = getResources().getDisplayMetrics().density;
                                  float edgeZone = 40 * density;
                                  float minDistance = 80 * density;
                                  float minVelocity = 300 * density;

                                  float diffX = e2.getX() - e1.getX();
                                  float diffY = e2.getY() - e1.getY();
                                  boolean startedNearLeftEdge = e1.getX() <= edgeZone;
                                  boolean isHorizontalSwipe = Math.abs(diffX) > Math.abs(diffY);
                                  boolean isLeftToRight = diffX > minDistance;
                                  boolean isFastEnough = Math.abs(velocityX) > minVelocity;

                                  if (startedNearLeftEdge && isHorizontalSwipe && isLeftToRight && isFastEnough) {
                                      if (webView.canGoBack()) {
                                          webView.goBack();
                                          vibrateShort();
                                      }
                                      return true;
                                  }
                                  return false;
                              }
                          });
                          webView.setOnTouchListener((v, event) -> {
                              doubleTapDetector.onTouchEvent(event);
                              return false;
                          });

                          // 39: Native offline cache — Android WebView cannot reliably let a
                          // Service Worker intercept the top-level page (navigation) request,
                          // especially on a cold start; that's what caused
                          // net::ERR_NAME_NOT_RESOLVED even though sw.js had already cached the
                          // page. This replaces that layer for navigation requests only: every
                          // page load first tries the live server and, on success, saves the
                          // full response to disk; if the network call fails (offline), it
                          // serves the last successful copy of that exact URL from disk instead
                          // — so previously-viewed pages open fully offline, the same way they
                          // do in Chrome/PWA. Non-navigation requests (CSS/JS/images/?action=
                          // API calls) and the bundled local shell (host "localhost") are left
                          // untouched — those still go through the normal WebView/SW pipeline,
                          // which already works fine for them.
                          webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {
                              @Override
                              public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                                  super.onPageStarted(view, url, favicon);
                                  startLoadingProgress();
                              }

                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  super.onPageFinished(view, url);
                                  finishLoadingProgress();
                              }

                              // 43: Telegram-style offline handling. Previously, tapping a link while
                              // offline (to a page not yet in the offline cache) fully navigated the
                              // WebView to OFFLINE_FALLBACK_HTML — replacing whatever the user was
                              // looking at with a "this page hasn't been saved offline" screen, on
                              // EVERY tap. This runs earlier, before that navigation even starts: if
                              // we're offline and the destination isn't cached, it blocks the
                              // navigation entirely (the current page just stays as-is, untouched)
                              // and only flashes the top banner — same as Telegram staying on the
                              // chat list and just showing "Waiting for network..." up top instead of
                              // replacing the whole screen with an error. The cold-start gateway URL
                              // (OFFLINE_ENTRY_URL) is deliberately excluded here so it still falls
                              // through to shouldInterceptRequest below, which knows how to redirect
                              // it to the last successfully-viewed page.
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                                  Uri uri = request.getUrl();
                                  String host = uri.getHost();
                                  boolean isLiveDomain = host != null && host.endsWith("realvisionacademy.site.je");
                                  String urlStr = uri.toString();
                                  boolean isColdStartEntry = urlStr.equals(OFFLINE_ENTRY_URL);
                                  if (request.isForMainFrame() && isLiveDomain && !isColdStartEntry
                                          && "GET".equalsIgnoreCase(request.getMethod())) {
                                      // Uses the periodically-refreshed real-internet probe, not just
                                      // isNetworkAvailable() — that flag can say "connected" even when
                                      // the network can't actually reach the server, which used to let
                                      // doomed navigations through to shouldInterceptRequest below and
                                      // land on the "not saved offline" fallback page. No toast/popup
                                      // here — the top banner alone is the only offline indicator, as
                                      // requested (Telegram-style: quiet, top-only, never interrupts).
                                      boolean offline = !isNetworkAvailable() || !hasRealInternetSignal;
                                      if (offline && offlineCacheGetBytes(urlStr) == null) {
                                          runOnUiThread(() -> setBanner("YOU ARE OFFLINE, SOME FEATURES DOES NOT WORK", true));
                                          return true;
                                      }
                                  }
                                  return super.shouldOverrideUrlLoading(view, request);
                              }

                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                                  Uri uri = request.getUrl();
                                  String host = uri.getHost();
                                  boolean isLiveDomain = host != null && host.endsWith("realvisionacademy.site.je");
                                  if (!request.isForMainFrame() || !isLiveDomain || !"GET".equalsIgnoreCase(request.getMethod())) {
                                      return super.shouldInterceptRequest(view, request);
                                  }
                                  String urlStr = uri.toString();
                                  try {
                                      HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                                      conn.setConnectTimeout(8000);
                                      conn.setReadTimeout(12000);
                                      conn.setInstanceFollowRedirects(true);
                                      for (Map.Entry<String, String> h : request.getRequestHeaders().entrySet()) {
                                          conn.setRequestProperty(h.getKey(), h.getValue());
                                      }
                                      String cookie = CookieManager.getInstance().getCookie(urlStr);
                                      if (cookie != null) conn.setRequestProperty("Cookie", cookie);

                                      int code = conn.getResponseCode();
                                      List<String> setCookies = conn.getHeaderFields().get("Set-Cookie");
                                      if (setCookies != null) {
                                          for (String sc : setCookies) CookieManager.getInstance().setCookie(urlStr, sc);
                                          CookieManager.getInstance().flush();
                                      }
                                      InputStream stream = (code >= 200 && code < 400) ? conn.getInputStream() : conn.getErrorStream();
                                      byte[] data = readAllBytes(stream);
                                      String contentType = conn.getContentType();
                                      String mime = (contentType != null && contentType.contains("/")) ? contentType.split(";")[0].trim() : "text/html";
                                      if (code >= 200 && code < 300) {
                                          offlineCachePut(urlStr, mime, data);
                                          // Bug fix ("close app, reopen offline -> lands on login"):
                                          // urlStr is the ORIGINALLY requested URL (always the fixed
                                          // gateway entry, e.g. /other_dashboard), but conn followed
                                          // server-side redirects, so conn.getURL() is the REAL page
                                          // that ended up rendering (e.g. /natural_dashboard, or /index
                                          // for a guest). Cache under that real URL too, and remember
                                          // it as "last successful page" — that pointer is what the
                                          // offline path below trusts for the gateway URL, instead of
                                          // only the gateway URL's own cache entry.
                                          String finalUrl = (conn.getURL() != null) ? conn.getURL().toString() : urlStr;
                                          if (!finalUrl.equals(urlStr)) {
                                              offlineCachePut(finalUrl, mime, data);
                                          }
                                          getSharedPreferences("realvision_prefs", MODE_PRIVATE)
                                              .edit().putString("last_page_url", finalUrl).apply();
                                      }
                                      return new WebResourceResponse(mime, "UTF-8", new ByteArrayInputStream(data));
                                  } catch (Exception e) {
                                      if (urlStr.equals(OFFLINE_ENTRY_URL)) {
                                          String lastUrl = getSharedPreferences("realvision_prefs", MODE_PRIVATE)
                                              .getString("last_page_url", null);
                                          if (lastUrl != null) {
                                              byte[] lastCached = offlineCacheGetBytes(lastUrl);
                                              if (lastCached != null) {
                                                  String lastMime = offlineCacheGetMime(lastUrl);
                                                  return new WebResourceResponse(lastMime != null ? lastMime : "text/html", "UTF-8", new ByteArrayInputStream(lastCached));
                                              }
                                          }
                                      }
                                      byte[] cached = offlineCacheGetBytes(urlStr);
                                      if (cached != null) {
                                          String cachedMime = offlineCacheGetMime(urlStr);
                                          return new WebResourceResponse(cachedMime != null ? cachedMime : "text/html", "UTF-8", new ByteArrayInputStream(cached));
                                      }
                                      byte[] fallback = OFFLINE_FALLBACK_HTML.getBytes(StandardCharsets.UTF_8);
                                      return new WebResourceResponse("text/html", "UTF-8", new ByteArrayInputStream(fallback));
                                  }
                              }
                          });
                      }

                      // 19-20: Root / USB-debug detection warning
                      if (isRooted()) {
                          Toast.makeText(this, "ማስጠንቀቂያ፡ ስልኩ root የተደረገ ነው", Toast.LENGTH_LONG).show();
                      }
                      if (isUsbDebuggingOn()) {
                          Toast.makeText(this, "ማስጠንቀቂያ፡ USB Debugging በርቷል", Toast.LENGTH_LONG).show();
                      }
                      // 36: Emulator detection warning
                      if (isEmulator()) {
                          Toast.makeText(this, "ማስጠንቀቂያ፡ emulator ላይ እየሮጠ ነው", Toast.LENGTH_LONG).show();
                      }

                      // 21: Network check + bilingual toast
                      if (!isNetworkAvailable()) {
                          Toast.makeText(this, "የኢንተርኔት ግንኙነት የለም / No internet connection", Toast.LENGTH_LONG).show();
                      }

                      // 32: Telegram-style network status banner
                      setupNetworkBanner();

                      // 33: Real-internet (package/data) check, polled periodically
                      connectivityHandler.post(periodicConnectivityCheck);

                      // 34: VPN detection on launch
                      checkVpnAndPrompt();

                      // 37: Force-update check against remote version JSON
                      checkForForceUpdate();

                      // 38: App-rating prompt after a few launches
                      maybePromptRating();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  try {
                      // 34a: Re-check VPN when returning from Settings
                      checkVpnAndPrompt();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              // --- Native offline cache helpers (feature 39) -----------------------

              // Must match the URL the bundled www/index.html gateway shell
              // redirects to on every cold start (see "Create local gateway
              // shell" step above).
              private static final String OFFLINE_ENTRY_URL = "https://realvisionacademy.site.je/other_dashboard";

              private static final String OFFLINE_FALLBACK_HTML =
                  "<!DOCTYPE html><html lang=\"am\"><head><meta charset=\"UTF-8\">" +
                  "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">" +
                  "<title>RealVision Academy</title><style>" +
                  "*{box-sizing:border-box;margin:0;padding:0}" +
                  "html,body{height:100%;background:#0f172a;color:#f1f5f9;font-family:sans-serif}" +
                  "#w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px}" +
                  ".logo{width:84px;height:84px;border-radius:20px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:20px}" +
                  "h1{font-size:20px;font-weight:700;margin-bottom:6px}" +
                  "p{color:#94a3b8;font-size:14px;max-width:320px;line-height:1.6;margin-top:6px}" +
                  "</style></head><body><div id=\"w\"><div class=\"logo\">&#127891;</div>" +
                  "<h1>&#4218;&#4661;&#121;&#4635;&#4763; &#4622;&#4837; &#4771;&#4813;&#4291;&#4291;&#4275;</h1>" +
                  "<p>&#4864;&#4655; &#4308;&#4295;&#4271;&#4231;&#4265;&#4275; &#4632;&#4231;&#4275;&#4275;. &#4635;&#4761;&#4231;&#4275;&#4275; &#4632;&#4661;&#4295;&#4231; &#4635;&#4771;&#4275;&#4271; &#4661;&#4231;&#4231; &#4691;&#4661;&#4231;&#4771;&#4275;&#4291; &#4635;&#4265;&#4266;&#4275;&#4291; &#4295;&#4271;&#4291;&#4635;.<br>This page hasn't been saved for offline use yet. Please open it once while online.</p>" +
                  "</div></body></html>";

              private File offlineCacheDir() {
                  File dir = new File(getFilesDir(), "offline_cache");
                  if (!dir.exists()) dir.mkdirs();
                  return dir;
              }

              private String offlineCacheKey(String url) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("MD5");
                      byte[] digest = md.digest(url.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (byte b : digest) sb.append(String.format("%02x", b));
                      return sb.toString();
                  } catch (Exception e) {
                      return String.valueOf(url.hashCode());
                  }
              }

              private void offlineCachePut(String url, String mime, byte[] data) {
                  try {
                      String key = offlineCacheKey(url);
                      File dir = offlineCacheDir();
                      try (FileOutputStream fos = new FileOutputStream(new File(dir, key + ".bin"))) {
                          fos.write(data);
                      }
                      try (FileOutputStream fos = new FileOutputStream(new File(dir, key + ".mime"))) {
                          fos.write((mime == null ? "text/html" : mime).getBytes(StandardCharsets.UTF_8));
                      }
                      pruneOfflineCacheIfNeeded(dir, 400);
                  } catch (Exception e) {
                      // Non-fatal — just means this page won't be available offline yet
                  }
              }

              private byte[] offlineCacheGetBytes(String url) {
                  try {
                      File f = new File(offlineCacheDir(), offlineCacheKey(url) + ".bin");
                      if (!f.exists()) return null;
                      try (FileInputStream fis = new FileInputStream(f)) {
                          return readAllBytes(fis);
                      }
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String offlineCacheGetMime(String url) {
                  try {
                      File f = new File(offlineCacheDir(), offlineCacheKey(url) + ".mime");
                      if (!f.exists()) return null;
                      try (FileInputStream fis = new FileInputStream(f)) {
                          return new String(readAllBytes(fis), StandardCharsets.UTF_8);
                      }
                  } catch (Exception e) {
                      return null;
                  }
              }

              // Keeps the native offline cache from growing without bound — deletes the
              // oldest entries once the file count passes maxFiles.
              private void pruneOfflineCacheIfNeeded(File dir, int maxFiles) {
                  File[] files = dir.listFiles();
                  if (files == null || files.length <= maxFiles) return;
                  java.util.Arrays.sort(files, (a, b) -> Long.compare(a.lastModified(), b.lastModified()));
                  int toDelete = files.length - maxFiles;
                  for (int i = 0; i < toDelete; i++) files[i].delete();
              }

              private byte[] readAllBytes(InputStream in) throws Exception {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                  return out.toByteArray();
              }


              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (networkCallback != null) {
                          ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                          if (cm != null) cm.unregisterNetworkCallback(networkCallback);
                      }
                      connectivityHandler.removeCallbacks(periodicConnectivityCheck);
                  } catch (Exception e) {
                      // ignore
                  }
              }

              // 40a: Chrome/YouTube-style animated top progress bar, pinned to the very
              // top. We don't have real byte-level progress (shouldInterceptRequest reads
              // the whole main-document response before handing it to the WebView, and
              // sub-resources load through the normal pipeline), so this fakes it the same
              // way most professional apps do: ease quickly up to ~90% while the page is
              // loading, then snap to 100% and fade out the instant it's done. See
              // startLoadingProgress()/finishLoadingProgress() below.
              private void setupTopProgressBar() {
                  topProgressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  topProgressBar.setIndeterminate(false);
                  topProgressBar.setMax(100);
                  topProgressBar.setProgress(0);
                  topProgressBar.setVisibility(View.GONE);
                  topProgressBar.getProgressDrawable().setColorFilter(Color.parseColor("#3b82f6"), android.graphics.PorterDuff.Mode.SRC_IN);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      6
                  );
                  params.gravity = Gravity.TOP;
                  addContentView(topProgressBar, params);
              }

              // Called from onPageStarted: reset to 0%, fade fully in, then glide up to 90%
              // over 4s with a decelerating curve (fast start, slow crawl) — never reaching
              // 100% on its own, so it always looks "alive" for however long the real load
              // actually takes, instead of stalling flat like a plain indeterminate spinner.
              private void startLoadingProgress() {
                  if (topProgressBar == null) return;
                  if (progressAnimator != null) progressAnimator.cancel();
                  topProgressBar.animate().cancel();
                  topProgressBar.setAlpha(1f);
                  topProgressBar.setProgress(0);
                  topProgressBar.setVisibility(View.VISIBLE);

                  progressAnimator = ValueAnimator.ofInt(0, 90);
                  progressAnimator.setDuration(4000);
                  progressAnimator.setInterpolator(new DecelerateInterpolator(1.5f));
                  progressAnimator.addUpdateListener(a -> topProgressBar.setProgress((int) a.getAnimatedValue()));
                  progressAnimator.start();
              }

              // Called from onPageFinished: snap the remaining distance to 100% quickly
              // (200ms), hold briefly so the completed bar is visible, then fade out and
              // reset — ready for the next navigation.
              private void finishLoadingProgress() {
                  if (topProgressBar == null) return;
                  if (progressAnimator != null) progressAnimator.cancel();

                  ValueAnimator finishAnim = ValueAnimator.ofInt(topProgressBar.getProgress(), 100);
                  finishAnim.setDuration(200);
                  finishAnim.addUpdateListener(a -> topProgressBar.setProgress((int) a.getAnimatedValue()));
                  finishAnim.addListener(new AnimatorListenerAdapter() {
                      @Override
                      public void onAnimationEnd(Animator animation) {
                          topProgressBar.animate()
                              .alpha(0f)
                              .setStartDelay(150)
                              .setDuration(250)
                              .withEndAction(() -> {
                                  topProgressBar.setVisibility(View.GONE);
                                  topProgressBar.setProgress(0);
                                  topProgressBar.setAlpha(1f);
                              })
                              .start();
                      }
                  });
                  finishAnim.start();
              }

              // 32a: Sets up a top banner that mimics Telegram's connection status text —
              // slim, pinned to the very top, doesn't push or overlay page content below it.
              private void setupNetworkBanner() {
                  float density = getResources().getDisplayMetrics().density;
                  networkBanner = new TextView(this);
                  networkBanner.setTextColor(Color.WHITE);
                  networkBanner.setTextSize(12);
                  networkBanner.setGravity(Gravity.CENTER);
                  networkBanner.setBackgroundColor(Color.parseColor("#2b2140"));
                  networkBanner.setPadding(0, (int) (7 * density), 0, (int) (7 * density));
                  networkBanner.setVisibility(View.GONE);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  params.gravity = Gravity.TOP;
                  addContentView(networkBanner, params);

                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return;

                  NetworkRequest request = new NetworkRequest.Builder().build();
                  networkCallback = new ConnectivityManager.NetworkCallback() {
                      @Override
                      public void onLost(Network network) {
                          runOnUiThread(() -> setBanner("YOU ARE OFFLINE, SOME FEATURES DOES NOT WORK", true));
                      }

                      @Override
                      public void onUnavailable() {
                          runOnUiThread(() -> setBanner("YOU ARE OFFLINE, SOME FEATURES DOES NOT WORK", true));
                      }

                      @Override
                      public void onAvailable(Network network) {
                          runOnUiThread(() -> {
                              setBanner("Connecting...", true);
                              bannerHandler.postDelayed(() -> {
                                  setBanner("Updating...", true);
                                  WebView webView = bridge != null ? bridge.getWebView() : null;
                                  if (webView != null) webView.reload();
                                  bannerHandler.postDelayed(() -> checkRealInternet(), 1200);
                              }, 800);
                          });
                      }
                  };

                  cm.registerNetworkCallback(request, networkCallback);
              }

              private void setBanner(String text, boolean visible) {
                  if (networkBanner == null) return;
                  if (text != null) networkBanner.setText(text);
                  networkBanner.setVisibility(visible ? View.VISIBLE : View.GONE);
              }

              // 33a: Confirms whether the connected network actually reaches the internet
              // (as opposed to just being "connected" per Android, which is also true when
              // the SIM's data package/balance has run out). Does this by quickly attempting
              // a socket connection to google.com; it cannot read the phone's data balance
              // directly, so this is only a proxy signal for "no real internet", which is the
              // most common cause of that condition.
              private void checkRealInternet() {
                  if (!isNetworkAvailable()) {
                      hasRealInternetSignal = false;
                      runOnUiThread(() -> setBanner("YOU ARE OFFLINE, SOME FEATURES DOES NOT WORK", true));
                      return;
                  }
                  new Thread(() -> {
                      boolean hasRealInternet;
                      try {
                          java.net.Socket socket = new java.net.Socket();
                          socket.connect(new java.net.InetSocketAddress("google.com", 443), 2500);
                          socket.close();
                          hasRealInternet = true;
                      } catch (Exception e) {
                          hasRealInternet = false;
                      }
                      final boolean result = hasRealInternet;
                      hasRealInternetSignal = result;
                      runOnUiThread(() -> {
                          if (!isNetworkAvailable()) {
                              setBanner("YOU ARE OFFLINE, SOME FEATURES DOES NOT WORK", true);
                          } else if (!result) {
                              setBanner("YOU ARE ONLINE BUT CHECK YOUR PACKAGE!", true);
                          } else {
                              setBanner(null, false);
                          }
                      });
                  }).start();
              }

              // 34a: Detects an active VPN connection and, if found, shows a blocking dialog.
              private boolean isVpnActive() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return false;
                      Network network = cm.getActiveNetwork();
                      if (network == null) return false;
                      NetworkCapabilities capabilities = cm.getNetworkCapabilities(network);
                      return capabilities != null && capabilities.hasTransport(NetworkCapabilities.TRANSPORT_VPN);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void checkVpnAndPrompt() {
                  if (vpnDialogShowing || isFinishing()) return;
                  if (isVpnActive()) {
                      showVpnDialog();
                  }
              }

              private void showVpnDialog() {
                  vpnDialogShowing = true;
                  new AlertDialog.Builder(this)
                      .setTitle("VPN Detected")
                      .setMessage("VPN ተገኝቷል። ይህን መተግበሪያ ለመጠቀም እባክዎ VPN ን ያጥፉ።\nA VPN was detected. Please disable it to use this app.\n\nOpen VPN settings now?")
                      .setCancelable(false)
                      .setPositiveButton("Yes", (dialog, which) -> {
                          vpnDialogShowing = false;
                          try {
                              startActivity(new Intent(Settings.ACTION_VPN_SETTINGS));
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      })
                      .setNegativeButton("No", (dialog, which) -> {
                          vpnDialogShowing = false;
                          finish();
                      })
                      .show();
              }

              // 22-23: Double-back-to-exit + WebView history back
              @Override
              public void onBackPressed() {
                  WebView webView = this.bridge.getWebView();
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  if (doubleBackToExitPressedOnce) {
                      super.onBackPressed();
                      return;
                  }
                  this.doubleBackToExitPressedOnce = true;
                  Toast.makeText(this, "ለመውጣት ደግመው ይንኩ / Tap again to exit", Toast.LENGTH_SHORT).show();
                  vibrateShort();
                  exitHandler.postDelayed(() -> doubleBackToExitPressedOnce = false, 2000);
              }

              // 24: Vibration feedback
              private void vibrateShort() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v == null) return;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(50, VibrationEffect.DEFAULT_AMPLITUDE));
                      } else {
                          v.vibrate(50);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              // 25: Network check helper
              private boolean isNetworkAvailable() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      NetworkInfo activeNetwork = cm != null ? cm.getActiveNetworkInfo() : null;
                      return activeNetwork != null && activeNetwork.isConnectedOrConnecting();
                  } catch (Exception e) {
                      return true;
                  }
              }

              // 26: Root detection helper
              private boolean isRooted() {
                  try {
                      String[] paths = {
                          "/system/app/Superuser.apk", "/sbin/su", "/system/bin/su",
                          "/system/xbin/su", "/data/local/xbin/su", "/data/local/bin/su",
                          "/system/sd/xbin/su", "/system/bin/failsafe/su", "/data/local/su"
                      };
                      for (String path : paths) {
                          if (new java.io.File(path).exists()) return true;
                      }
                  } catch (Exception e) {
                      // ignore
                  }
                  return false;
              }

              // 27: USB debugging detection helper
              private boolean isUsbDebuggingOn() {
                  try {
                      return android.provider.Settings.Secure.getInt(
                          getContentResolver(),
                          android.provider.Settings.Global.ADB_ENABLED, 0) == 1;
                  } catch (Exception e) {
                      return false;
                  }
              }

              // 36a: Emulator detection helper
              private boolean isEmulator() {
                  try {
                      return Build.FINGERPRINT.startsWith("generic")
                          || Build.FINGERPRINT.startsWith("unknown")
                          || Build.MODEL.contains("google_sdk")
                          || Build.MODEL.contains("Emulator")
                          || Build.MODEL.contains("Android SDK built for x86")
                          || Build.MANUFACTURER.contains("Genymotion")
                          || (Build.BRAND.startsWith("generic") && Build.DEVICE.startsWith("generic"))
                          || "google_sdk".equals(Build.PRODUCT);
                  } catch (Exception e) {
                      return false;
                  }
              }

              // 37a: TODO — replace with your real hosted JSON, e.g.:
              // {"latestVersionCode": 3, "forceUpdate": true, "playStoreUrl": "https://play.google.com/store/apps/details?id=..."}
              private static final String UPDATE_CHECK_URL = "https://example.com/realvision-version.json";

              private void checkForForceUpdate() {
                  new Thread(() -> {
                      try {
                          URL url = new URL(UPDATE_CHECK_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(4000);
                          conn.setReadTimeout(4000);
                          BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) sb.append(line);
                          reader.close();

                          JSONObject json = new JSONObject(sb.toString());
                          int latestVersionCode = json.optInt("latestVersionCode", -1);
                          boolean forceUpdate = json.optBoolean("forceUpdate", false);
                          String storeUrl = json.optString(
                              "playStoreUrl",
                              "https://play.google.com/store/apps/details?id=" + getPackageName()
                          );
                          int currentVersionCode = getVersionCode();

                          if (forceUpdate && latestVersionCode > currentVersionCode) {
                              runOnUiThread(() -> showForceUpdateDialog(storeUrl));
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              private int getVersionCode() {
                  try {
                      PackageInfo pInfo = getPackageManager().getPackageInfo(getPackageName(), 0);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          return (int) pInfo.getLongVersionCode();
                      }
                      return pInfo.versionCode;
                  } catch (Exception e) {
                      return -1;
                  }
              }

              private void showForceUpdateDialog(String storeUrl) {
                  if (isFinishing()) return;
                  new AlertDialog.Builder(this)
                      .setTitle("Update Required / ማሻሻያ ያስፈልጋል")
                      .setMessage("አዲስ ስሪት አለ፣ ለመቀጠል እባክዎ ያዘምኑ።\nA new version is available. Please update to continue.")
                      .setCancelable(false)
                      .setPositiveButton("Update", (dialog, which) -> {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(storeUrl)));
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                          finish();
                      })
                      .show();
              }

              // 38a: Prompts for a Play Store rating after the 5th launch, once only
              private void maybePromptRating() {
                  try {
                      SharedPreferences prefs = getSharedPreferences("realvision_prefs", MODE_PRIVATE);
                      int launches = prefs.getInt("launch_count", 0) + 1;
                      prefs.edit().putInt("launch_count", launches).apply();

                      boolean alreadyHandled = prefs.getBoolean("rated_or_dismissed", false);
                      if (!alreadyHandled && launches == 5) {
                          showRatingDialog(prefs);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void showRatingDialog(SharedPreferences prefs) {
                  if (isFinishing()) return;
                  new AlertDialog.Builder(this)
                      .setTitle("Enjoying the app? / መተግበሪያውን ወደዱት?")
                      .setMessage("Play Store ላይ 5 ኮከብ ቢሰጡን ደስ ይለናል!\nWe'd love a 5-star rating on the Play Store!")
                      .setPositiveButton("Rate Now", (dialog, which) -> {
                          prefs.edit().putBoolean("rated_or_dismissed", true).apply();
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + getPackageName())));
                          } catch (Exception e) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=" + getPackageName())));
                          }
                      })
                      .setNegativeButton("Later", (dialog, which) -> {
                          prefs.edit().putBoolean("rated_or_dismissed", true).apply();
                      })
                      .show();
              }

              // 35a: Native share, callable from the web page as: AndroidShare.shareText("some text")
              private class WebAppInterface {
                  @JavascriptInterface
                  public void shareText(String text) {
                      runOnUiThread(() -> {
                          try {
                              Intent shareIntent = new Intent(Intent.ACTION_SEND);
                              shareIntent.setType("text/plain");
                              shareIntent.putExtra(Intent.EXTRA_TEXT, text);
                              startActivity(Intent.createChooser(shareIntent, "Share via"));
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      });
                  }
              }
          }
          JAVAEOF

      - name: Update AndroidManifest (orientation, keyboard, permissions, deep link)
        run: |
          python3 << 'PYEOF'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          # 28-29: Force portrait + keyboard resize, only on MainActivity, only if not already present
          def add_attrs(match):
              block = match.group(0)
              if 'android:screenOrientation' in block:
                  return block
              return block.replace(
                  '<activity',
                  '<activity\n            android:screenOrientation="portrait"\n            android:windowSoftInputMode="adjustResize"',
                  1
              )

          content = re.sub(
              r'<activity[^>]*android:name="\.MainActivity"[^>]*>',
              add_attrs,
              content,
              count=1
          )

          # 30: VIBRATE permission
          if 'android.permission.VIBRATE' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.VIBRATE" />\n    <application',
                  1
              )

          # 31: Deep link intent-filter (web+realvision://), inserted only inside MainActivity's block,
          # right before its closing </activity> tag, and only once.
          def add_deep_link(match):
              block = match.group(0)
              if 'web+realvision' in block:
                  return block
              deep_link_filter = '''        <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="web+realvision" />
              </intent-filter>
          </activity>'''
              return re.sub(r'</activity>\s*$', deep_link_filter, block, count=1)

          content = re.sub(
              r'<activity[^>]*android:name="\.MainActivity".*?</activity>',
              add_deep_link,
              content,
              count=1,
              flags=re.DOTALL
          )

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Update styles.xml (status/nav bar colors)
        run: |
          python3 << 'PYEOF'
          import re

          path = "android/app/src/main/res/values/styles.xml"
          with open(path) as f:
              content = f.read()

          # Only inject into the base "AppTheme" style — never into splash-screen
          # or other derived styles, which is what was crashing the app on launch.
          def add_items(match):
              block = match.group(0)
              if 'android:statusBarColor' in block:
                  return block
              return re.sub(
                  r'</style>\s*$',
                  '    <item name="android:statusBarColor">#0b0518</item>\n'
                  '        <item name="android:navigationBarColor">#0b0518</item>\n'
                  '        <item name="android:windowBackground">#0b0518</item>\n'
                  '    </style>',
                  block
              )

          content = re.sub(
              r'<style name="AppTheme"[^>]*>.*?</style>',
              add_items,
              content,
              count=1,
              flags=re.DOTALL
          )

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

