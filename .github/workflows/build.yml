name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/android@^6.0.0 @capacitor/splash-screen@^6.0.0
          npm install -D @capacitor/cli@^6.0.0

      - name: Write capacitor.config.json (local shell first, no direct server.url)
        run: |
          cat > capacitor.config.json << 'CAPEOF'
          {
            "appId": "com.realvisionacademy.app",
            "appName": "RealVision Academy",
            "webDir": "www",
            "server": {
              "cleartext": false,
              "androidScheme": "https",
              "allowNavigation": [
                "realvisionacademy.site.je",
                "*.realvisionacademy.site.je"
              ]
            },
            "android": {
              "allowMixedContent": false
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1200,
                "launchAutoHide": true,
                "launchFadeOutDuration": 350,
                "backgroundColor": "#0b0518",
                "showSpinner": true,
                "spinnerColor": "#3b82f6",
                "androidSpinnerStyle": "large",
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          CAPEOF

      - name: Create local gateway shell (www/index.html)
        run: |
          mkdir -p www
          # Bug fix (round 2): this used to redirect to "/" (and, in an
          # earlier attempt, to "/index"). Both are wrong for the same
          # underlying reason: index.php is the PUBLIC guest landing page —
          # it always shows the "Login" button/marketing home, even for an
          # already-logged-in student, because it's not the app's real
          # per-student home. The actual home lives at one of 4 dept-scoped
          # entry files (natural_dashboard.php / social_dashboard.php /
          # freshman_dashboard.php / other_dashboard.php), each of which
          # starts with: if (!isLoggedIn()) redirect to /index; else if
          # wrong department, redirect to the correct dept dashboard. That
          # makes any one of them a self-correcting router. We use
          # "/other_dashboard" here for exactly that: a guest lands on
          # /index as normal, but an already-logged-in student (any
          # department) is auto-redirected server-side straight to their
          # real dashboard — so the offline cache captured under this URL
          # always reflects "am I logged in, and as whom" correctly,
          # instead of permanently showing the guest/login screen.
          # This is what the WebView loads on EVERY cold start — bundled inside
          # the APK, so it needs zero network to display. It just hands off
          # immediately to the live URL; MainActivity.java's custom
          # WebViewClient.shouldInterceptRequest (feature 39) is what actually
          # decides, per navigation, whether to fetch live or serve the native
          # offline cache — so this file only needs to exist and redirect, not
          # contain any connectivity logic itself.
          cat > www/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="am">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <meta http-equiv="refresh" content="2; url=https://realvisionacademy.site.je/other_dashboard">
          <title>RealVision Academy</title>
          <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }
          html, body { height: 100%; background: #0b0518; color: #f1f5f9; font-family: -apple-system, Roboto, "Noto Sans Ethiopic", "Nyala", sans-serif; overflow: hidden; }
          #wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; position: relative; }
          .glow { position: absolute; width: 360px; height: 360px; border-radius: 50%; background: radial-gradient(circle, rgba(59,130,246,0.25), rgba(11,5,24,0) 70%); filter: blur(10px); animation: pulse 2.6s ease-in-out infinite; }
          @keyframes pulse { 0%,100% { transform: scale(0.92); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } }
          .logo-icon { width: 108px; height: auto; margin-bottom: 18px; opacity: 0; transform: translateY(-26px) scale(0.75); filter: drop-shadow(0 10px 22px rgba(59,130,246,0.45)); animation: dropIn 0.65s cubic-bezier(.22,1,.36,1) 0.05s forwards; position: relative; z-index: 1; }
          @keyframes dropIn { to { opacity: 1; transform: translateY(0) scale(1); } }
          h1.brand { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 10px; opacity: 0; animation: fadeUp 0.5s ease 0.55s forwards; position: relative; z-index: 1; }
          h1.brand span { background: linear-gradient(135deg, #6fa8d8, #3b82f6 55%, #1d4ed8); -webkit-background-clip: text; background-clip: text; color: transparent; }
          @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
          .letters { margin-top: 2px; font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #94a3b8; display: flex; justify-content: center; flex-wrap: wrap; max-width: 300px; min-height: 16px; position: relative; z-index: 1; }
          .letters span { display: inline-block; opacity: 0; transition: transform 0.75s cubic-bezier(.22,1,.36,1), opacity 0.4s ease; will-change: transform, opacity; }
          .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #1e293b; border-top-color: #3b82f6; animation: spin 0.8s linear infinite; margin: 22px 0 12px; opacity: 0; animation: spin 0.8s linear infinite, fadeUp 0.4s ease 1.3s forwards; position: relative; z-index: 1; }
          @keyframes spin { to { transform: rotate(360deg); } }
          p.sub { color: #94a3b8; font-size: 13px; max-width: 300px; line-height: 1.6; opacity: 0; animation: fadeUp 0.4s ease 1.4s forwards; position: relative; z-index: 1; }
          </style>
          </head>
          <body>
          <div id="wrap">
          <div class="glow"></div>
          <img class="logo-icon" src="data:image/png;base64," alt="Real Vision Academy">
          <h1 class="brand">Real Vision <span>Academy</span></h1>
          <div class="letters" id="letters"></div>
          <div class="spinner"></div>
          <p class="sub">በመገናኘት ላይ... / Connecting...</p>
          </div>
          <script>
          (function () {
            // Letter-assembly effect: each character of the caption starts at a
            // random offset/rotation around the logo and eases into place, staggered
            // left-to-right, so the wordmark looks like it's being gathered together
            // rather than just fading in flat.
            var text = 'REAL VISION ACADEMY';
            var host = document.getElementById('letters');
            text.split('').forEach(function (ch, i) {
              var span = document.createElement('span');
              span.textContent = ch === ' ' ? '  ' : ch;
              var angle = Math.random() * Math.PI * 2;
              var dist = 50 + Math.random() * 130;
              var dx = Math.cos(angle) * dist;
              var dy = Math.sin(angle) * dist;
              var rot = Math.round(Math.random() * 150 - 75);
              span.style.transform = 'translate(' + dx.toFixed(0) + 'px,' + dy.toFixed(0) + 'px) rotate(' + rot + 'deg)';
              host.appendChild(span);
              (function (el, delay) {
                setTimeout(function () {
                  el.style.transform = 'translate(0,0) rotate(0deg)';
                  el.style.opacity = '1';
                }, delay);
              })(span, 650 + i * 40 + Math.random() * 40);
            });
            // Hand off to the live dashboard once the assembly animation has had
            // time to play (matches the <meta refresh> above as a fallback path).
            setTimeout(function () {
              window.location.replace('https://realvisionacademy.site.je/other_dashboard');
            }, 1950);
          })();
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Write app logo drawable (for native loading popup)
        run: |
          # Decodes the same Real Vision mark used in www/index.html into a
          # native drawable resource, so MainActivity's loading popup (see
          # setupTopProgressBar/startLoadingProgress below) can show the real
          # brand mark instead of a generic spinner during page transitions.
          mkdir -p android/app/src/main/res/drawable
          echo '' | base64 -d > android/app/src/main/res/drawable/app_logo.png

      - name: Add extra Android dependencies (biometric lock)
        run: |
          python3 << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          # Adds AndroidX Biometric, used by the app-lock / session-timeout feature
          # in MainActivity.java below. Only inserted if not already present, so
          # re-running this workflow never duplicates the dependency line.
          if 'androidx.biometric:biometric' not in content:
              content = re.sub(
                  r'(dependencies\s*\{)',
                  r'\1\n    implementation "androidx.biometric:biometric:1.1.0"',
                  content,
                  count=1
              )

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Create app shortcuts (long-press icon menu)
        run: |
          mkdir -p android/app/src/main/res/xml
          # Static shortcuts shown on long-press of the app icon. Each points at
          # a deep-link URL that MainActivity reads on launch (see
          # SHORTCUT_URL_EXTRA handling below) and loads directly, instead of
          # always landing on the default dashboard gateway. Icons reuse the
          # app's own launcher icon set that Capacitor already generates, so
          # no extra artwork is required.
          cat > android/app/src/main/res/xml/shortcuts.xml << 'SHORTCUTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="dashboard"
                  android:enabled="true"
                  android:icon="@mipmap/ic_launcher"
                  android:shortcutShortLabel="@string/shortcut_dashboard_short"
                  android:shortcutLongLabel="@string/shortcut_dashboard_long">
                  <intent
                      android:action="android.intent.action.VIEW"
                      android:targetPackage="com.realvisionacademy.app"
                      android:targetClass="com.realvisionacademy.app.MainActivity">
                      <extra android:name="shortcut_url" android:value="https://realvisionacademy.site.je/other_dashboard" />
                  </intent>
              </shortcut>
              <shortcut
                  android:shortcutId="quiz"
                  android:enabled="true"
                  android:icon="@mipmap/ic_launcher"
                  android:shortcutShortLabel="@string/shortcut_quiz_short"
                  android:shortcutLongLabel="@string/shortcut_quiz_long">
                  <intent
                      android:action="android.intent.action.VIEW"
                      android:targetPackage="com.realvisionacademy.app"
                      android:targetClass="com.realvisionacademy.app.MainActivity">
                      <extra android:name="shortcut_url" android:value="https://realvisionacademy.site.je/question_bank" />
                  </intent>
              </shortcut>
          </shortcuts>
          SHORTCUTEOF

          python3 << 'PYEOF'
          import re
          path = "android/app/src/main/res/values/strings.xml"
          with open(path) as f:
              content = f.read()
          extra = (
              '    <string name="shortcut_dashboard_short">Dashboard</string>\n'
              '    <string name="shortcut_dashboard_long">Open my dashboard</string>\n'
              '    <string name="shortcut_quiz_short">Quiz</string>\n'
              '    <string name="shortcut_quiz_long">Open question bank</string>\n'
          )
          if 'shortcut_dashboard_short' not in content:
              content = content.replace('</resources>', extra + '</resources>')
          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Write full MainActivity.java (35+ native features)
        run: |
          FILE=$(find android -name MainActivity.java)
          PKG_LINE=$(head -n 1 "$FILE")
          cat > "$FILE" << JAVAEOF
          $PKG_LINE

          import android.app.AlertDialog;
          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkInfo;
          import android.net.NetworkRequest;
          import android.net.Uri;
          import android.provider.Settings;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Vibrator;
          import android.os.VibrationEffect;
          import android.view.Gravity;
          import android.view.GestureDetector;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.animation.DecelerateInterpolator;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ImageView;
          import android.widget.TextView;
          import android.animation.ObjectAnimator;
          import android.animation.PropertyValuesHolder;
          import android.graphics.drawable.ClipDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.view.animation.OvershootInterpolator;
          import android.view.animation.AccelerateInterpolator;
          import android.widget.Toast;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.Executor;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicInteger;

          public class MainActivity extends BridgeActivity {

              private boolean doubleBackToExitPressedOnce = false;
              private final Handler exitHandler = new Handler();
              private final Handler bannerHandler = new Handler(Looper.getMainLooper());
              private TextView networkBanner;
              private ProgressBar topProgressBar;
              private ValueAnimator progressAnimator;
              // 40b: Branded loading popup (logo + spinner card) shown alongside the
              // top progress bar during page-to-page navigation — see
              // setupTopProgressBar()/startLoadingProgress()/finishLoadingProgress().
              private View loadingPopup;
              private ImageView loadingPopupLogo;
              private ObjectAnimator popupPulseAnimator;
              private ConnectivityManager.NetworkCallback networkCallback;
              private final Handler connectivityHandler = new Handler(Looper.getMainLooper());
              private boolean vpnDialogShowing = false;
              // 43a: Guards the offline "page not available" dialog (Close/Retry) added
              // below, so a burst of taps on not-yet-cached links can't stack multiple
              // copies of the same dialog on screen at once.
              private boolean offlineDialogShowing = false;
              // Backing signal for feature 43 below — refreshed by checkRealInternet()
              // (on launch, every 10s, and on every network change), so it's more reliable
              // than the instantaneous isNetworkAvailable() check alone (that one only knows
              // "connected to a network", not "that network actually reaches the internet").
              private volatile boolean hasRealInternetSignal = true;
              private final Runnable periodicConnectivityCheck = new Runnable() {
                  @Override
                  public void run() {
                      checkRealInternet();
                      connectivityHandler.postDelayed(this, 10000);
                  }
              };

              // --- 45: Biometric app-lock + session timeout -------------------------
              // If the app was backgrounded for longer than this, require the
              // device's fingerprint/face/PIN before showing content again on resume.
              private static final long SESSION_TIMEOUT_MS = 5 * 60 * 1000L; // 5 minutes
              private long lastBackgroundedAt = 0L;
              private View lockOverlay;
              private boolean lockOverlayShowing = false;
              private final Executor biometricExecutor = Executors.newSingleThreadExecutor();

              // --- 46: Pull-to-refresh state ------------------------------------------
              private View pullIndicator;
              private float pullStartY = -1f;
              private boolean pullTracking = false;
              private static final float PULL_TRIGGER_DP = 90f;

              // --- 47: Soft (non-forced) update banner --------------------------------
              private View softUpdateBanner;

              // --- 50: Download-all-pages (native offline pre-fetch) ------------------
              private ExecutorService offlineDownloadPool;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      // 1-2: Screenshot + screen recording block
                      getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                      );
                      // 3: Keep screen on
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                      WebView webView = this.bridge.getWebView();
                      if (webView != null) {
                          WebSettings settings = webView.getSettings();

                          // 4-5: Zoom disable
                          settings.setSupportZoom(false);
                          settings.setBuiltInZoomControls(false);
                          settings.setDisplayZoomControls(false);

                          // 6-7: Storage + JS
                          settings.setDomStorageEnabled(true);
                          settings.setJavaScriptEnabled(true);

                          // 8: Cache
                          settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                          // 9: Mixed content block (HTTPS only)
                          settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                          // 10: Custom user agent
                          String ua = settings.getUserAgentString();
                          settings.setUserAgentString(ua + " RealVisionApp/1.0");

                          // 11-12: Long-press disabled for content protection (stops copying
                          // lesson text, images, etc.) — EXCEPT on editable text fields, where
                          // it must stay enabled or Android's native Paste / paste-suggestion
                          // strip never appears. This is what breaks pasting an email
                          // verification / OTP code into a blank input box if left blanket-
                          // disabled. WebView.HitTestResult reports EDIT_TEXT_TYPE only when
                          // the long-press lands on a focused, editable <input>/<textarea>, so
                          // we selectively let Android handle just those long-presses natively.
                          webView.setLongClickable(true);
                          webView.setHapticFeedbackEnabled(false);
                          webView.setOnLongClickListener(v -> {
                              WebView.HitTestResult result = webView.getHitTestResult();
                              if (result != null && result.getType() == WebView.HitTestResult.EDIT_TEXT_TYPE) {
                                  // Don't consume the event — let Android show its native
                                  // Paste / paste-suggestion toolbar for this field.
                                  return false;
                              }
                              return true;
                          });

                          // 13: Overscroll/bounce disable
                          webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);

                          // 14: Text zoom lock
                          settings.setTextZoom(100);

                          // 15: Cookies persist
                          CookieManager.getInstance().setAcceptCookie(true);
                          CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                          // 16: Disable WebView debugging in production
                          WebView.setWebContentsDebuggingEnabled(false);

                          // 17: Safe browsing
                          settings.setSafeBrowsingEnabled(true);

                          // 18: Render priority
                          settings.setRenderPriority(WebSettings.RenderPriority.HIGH);

                          // 35: Native share bridge — call from web page via AndroidShare.shareText("...")
                          WebAppInterface webAppInterface = new WebAppInterface();
                          webView.addJavascriptInterface(webAppInterface, "AndroidShare");
                          // 50: Same bridge object, registered under a second name too, so the
                          // website's JS can call AndroidOffline.downloadAllPages() /
                          // .getDownloadedPageCount() / .getTotalPageCount() without needing to
                          // know it happens to share a class with the share-sheet bridge.
                          webView.addJavascriptInterface(webAppInterface, "AndroidOffline");

                          // 40: Chrome-style top loading bar — shown on onPageStarted / hidden on
                          // onPageFinished below (added to the same WebViewClient override, next
                          // to feature 39, so a single navigation callback drives both).
                          setupTopProgressBar();

                          // 46a: Pull-to-refresh spinner, pinned to the top, hidden until the
                          // student actually drags down from the very top of the page.
                          setupPullIndicator();

                          // 47a: Dismissible "new version available" bar for optional updates —
                          // separate from the blocking dialog used for forceUpdate=true.
                          setupSoftUpdateBanner();

                          // 41: Double-tap anywhere on the page to refresh. Safe to bind directly
                          // to touch events because zoom is disabled (settings.setSupportZoom
                          // above), so there's no native double-tap-to-zoom gesture to collide with.
                          GestureDetector doubleTapDetector = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                              // Bug fix (double-tap needed 4 taps / 2 double-taps): GestureDetector
                              // must have onDown() return true for its internal tap sequence to be
                              // tracked correctly from the very first touch. SimpleOnGestureListener's
                              // default onDown() returns false, which can leave the detector's
                              // internal "waiting for the matching second tap" state one step behind
                              // — the first double-tap attempt gets silently absorbed re-arming the
                              // detector, and only the NEXT double-tap actually fires onDoubleTap.
                              @Override
                              public boolean onDown(MotionEvent e) {
                                  return true;
                              }

                              @Override
                              public boolean onDoubleTap(MotionEvent e) {
                                  webView.reload();
                                  vibrateShort();
                                  return true;
                              }

                              // 42: Edge swipe-back — a left-edge-to-right fling (like iOS/Android
                              // system back gesture) goes back in WebView history, e.g.
                              // question_bank -> dashboard. Restricted to swipes that START near
                              // the left edge, so it never fires from a normal horizontal swipe
                              // happening elsewhere inside the page content.
                              @Override
                              public boolean onFling(MotionEvent e1, MotionEvent e2, float velocityX, float velocityY) {
                                  if (e1 == null) return false;
                                  float density = getResources().getDisplayMetrics().density;
                                  float edgeZone = 40 * density;
                                  float minDistance = 80 * density;
                                  float minVelocity = 300 * density;

                                  float diffX = e2.getX() - e1.getX();
                                  float diffY = e2.getY() - e1.getY();
                                  boolean startedNearLeftEdge = e1.getX() <= edgeZone;
                                  boolean isHorizontalSwipe = Math.abs(diffX) > Math.abs(diffY);
                                  boolean isLeftToRight = diffX > minDistance;
                                  boolean isFastEnough = Math.abs(velocityX) > minVelocity;

                                  if (startedNearLeftEdge && isHorizontalSwipe && isLeftToRight && isFastEnough) {
                                      if (webView.canGoBack()) {
                                          webView.goBack();
                                          vibrateShort();
                                      }
                                      return true;
                                  }
                                  return false;
                              }
                          });
                          webView.setOnTouchListener((v, event) -> {
                              doubleTapDetector.onTouchEvent(event);
                              handlePullToRefreshTouch(webView, event);
                              return false;
                          });

                          // 42a: Without this, a left-edge swipe is captured by Android's own
                          // gesture navigation (API 29+ default: edge swipe = system Back, or
                          // the Recents/app-switcher preview if dragged/held) BEFORE it ever
                          // reaches the OnTouchListener above — this is exactly the "swipe
                          // left-to-right opens Recents instead of going back in the page"
                          // symptom. Declaring this strip as a system-gesture exclusion zone
                          // asks the OS to hand touches starting there to the app instead.
                          // Must be re-posted on every layout pass since it needs real pixel
                          // dimensions (0x0 on the very first call, before layout completes).
                          // Best-effort only: the OS can still cap how much edge an app is
                          // allowed to claim, and a user can always force the system gesture
                          // by repeating the same swipe a second time.
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              webView.addOnLayoutChangeListener((v, left, top, right, bottom, oldLeft, oldTop, oldRight, oldBottom) -> {
                                  if (v.getWidth() <= 0 || v.getHeight() <= 0) return;
                                  float density = getResources().getDisplayMetrics().density;
                                  int exclusionWidth = (int) (40 * density);
                                  java.util.List<android.graphics.Rect> rects = new java.util.ArrayList<>();
                                  rects.add(new android.graphics.Rect(0, 0, exclusionWidth, v.getHeight()));
                                  v.setSystemGestureExclusionRects(rects);
                              });
                          }

                          // 39: Native offline cache — Android WebView cannot reliably let a
                          // Service Worker intercept the top-level page (navigation) request,
                          // especially on a cold start; that's what caused
                          // net::ERR_NAME_NOT_RESOLVED even though sw.js had already cached the
                          // page. This replaces that layer for navigation requests only: every
                          // page load first tries the live server and, on success, saves the
                          // full response to disk; if the network call fails (offline), it
                          // serves the last successful copy of that exact URL from disk instead
                          // — so previously-viewed pages open fully offline, the same way they
                          // do in Chrome/PWA. Non-navigation requests (CSS/JS/images/?action=
                          // API calls) and the bundled local shell (host "localhost") are left
                          // untouched — those still go through the normal WebView/SW pipeline,
                          // which already works fine for them.
                          webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {
                              @Override
                              public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                                  super.onPageStarted(view, url, favicon);
                                  startLoadingProgress();
                              }

                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  super.onPageFinished(view, url);
                                  finishLoadingProgress();
                                  // 49: Native dark-mode signal. We can't force the web page's
                                  // theme — only realvisionacademy.site.je's own CSS/JS decides
                                  // what to do with this — but every page load now tells it what
                                  // the phone's system theme currently is, via a data-attribute
                                  // on <html>. If/when the site adds a rule like
                                  // [data-native-theme="dark"] { ... }, it'll pick this up for
                                  // free with zero further native changes needed.
                                  boolean isDark = (getResources().getConfiguration().uiMode
                                          & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;
                                  String theme = isDark ? "dark" : "light";
                                  view.evaluateJavascript(
                                      "document.documentElement.setAttribute('data-native-theme','" + theme + "');",
                                      null
                                  );
                              }

                              // 40a: Safety net for the top progress bar. onPageFinished is not
                              // guaranteed to fire on every device/OS version after a main-frame
                              // load fails (e.g. shouldInterceptRequest's catch-block below now
                              // returns null instead of a substitute page — see 43 fix). Without
                              // this, that scenario could leave the bar frozen at ~90% forever.
                              @Override
                              public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                                  // Deliberately NOT calling super.onReceivedError(...) — on some
                                  // WebView/OEM versions the default implementation is what paints
                                  // Chromium's own "net::ERR_NAME_NOT_RESOLVED" page. This callback
                                  // should be unreachable for main-frame live-domain GETs (they're
                                  // fully handled by shouldInterceptRequest above and never touch
                                  // WebView's own network stack), but if any edge case ever does
                                  // land here, we immediately paint our own branded page over it
                                  // instead of risking the native one showing even for a frame.
                                  if (request != null && request.isForMainFrame()) {
                                      finishLoadingProgress();
                                      view.loadDataWithBaseURL(null, offlineFallbackHtml(), "text/html", "UTF-8", null);
                                  }
                              }

                              @Override
                              public void onReceivedHttpError(WebView view, WebResourceRequest request, WebResourceResponse errorResponse) {
                                  // Same reasoning as onReceivedError above, for HTTP-level errors
                                  // (4xx/5xx) instead of connection-level ones. Also effectively
                                  // unreachable for the intercepted live-domain flow, kept only as
                                  // a second safety net so no raw browser error screen can appear.
                                  if (request != null && request.isForMainFrame()) {
                                      finishLoadingProgress();
                                      view.loadDataWithBaseURL(null, offlineFallbackHtml(), "text/html", "UTF-8", null);
                                  }
                              }

                              // 43: Telegram-style offline handling. Previously, tapping a link while
                              // offline (to a page not yet in the offline cache) fully navigated the
                              // WebView to a branded "this page hasn't been saved offline" page —
                              // replacing whatever the user was looking at with that screen, on
                              // EVERY tap. This runs earlier, before that navigation even starts: if
                              // we're offline and the destination isn't cached, it blocks the
                              // navigation entirely (the current page just stays as-is, untouched)
                              // and only flashes the top banner — same as Telegram staying on the
                              // chat list and just showing "Waiting for network..." up top instead of
                              // replacing the whole screen with an error. The cold-start gateway URL
                              // (OFFLINE_ENTRY_URL) is deliberately excluded here so it still falls
                              // through to shouldInterceptRequest below, which knows how to redirect
                              // it to the last successfully-viewed page.
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                                  Uri uri = request.getUrl();
                                  String host = uri.getHost();
                                  boolean isLiveDomain = host != null && host.endsWith("realvisionacademy.site.je");
                                  String urlStr = uri.toString();
                                  boolean isColdStartEntry = urlStr.equals(OFFLINE_ENTRY_URL);
                                  if (request.isForMainFrame() && isLiveDomain && !isColdStartEntry
                                          && "GET".equalsIgnoreCase(request.getMethod())) {
                                      // Uses the periodically-refreshed real-internet probe, not just
                                      // isNetworkAvailable() — that flag can say "connected" even when
                                      // the network can't actually reach the server, which used to let
                                      // doomed navigations through to shouldInterceptRequest below and
                                      // land on the "not saved offline" fallback page. No toast/popup
                                      // here — the top banner alone is the only offline indicator, as
                                      // requested (Telegram-style: quiet, top-only, never interrupts).
                                      //
                                      // Bug fix (CRASH — NetworkOnMainThreadException): a previous
                                      // revision called quickRealConnectivityProbe() (a blocking
                                      // socket connect) directly here. shouldOverrideUrlLoading is
                                      // documented by Android to run on the UI thread, so that call
                                      // crashed the app on almost every tap to a not-yet-cached page.
                                      // Removed — hasRealInternetSignal (refreshed every ~10s by
                                      // checkRealInternet(), safely on a background thread) plus the
                                      // shouldInterceptRequest catch-block below (which never shows
                                      // the branded fallback either way) together already guarantee
                                      // the one hard requirement: the "not saved offline" page can
                                      // never appear, without ever blocking the UI thread on network.
                                      boolean offline = !isNetworkAvailable() || !hasRealInternetSignal;
                                      boolean hasCache = offlineCacheGetBytes(urlStr) != null;
                                      if (offline && !hasCache) {
                                          runOnUiThread(() -> {
                                              setBanner(offlineBannerText(), true);
                                              showOfflineUnavailableDialog(view, urlStr);
                                          });
                                          return true;
                                      }
                                  }
                                  return super.shouldOverrideUrlLoading(view, request);
                              }

                              // Followed a maximum chain length to avoid ever looping forever on a
                              // misconfigured server that redirects to itself. Cleared whenever a
                              // request resolves without a redirect (see the 2xx/attempt-reset
                              // branch below), so normal browsing never accumulates stale counts.
                              private static final int MAX_REDIRECTS = 5;
                              private final Map<String, Integer> redirectHops = new java.util.concurrent.ConcurrentHashMap<>();

                              private int redirectHopCount(String targetUrl) {
                                  return redirectHops.merge(targetUrl, 1, Integer::sum);
                              }

                              @Override
                              public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                                  Uri uri = request.getUrl();
                                  String host = uri.getHost();
                                  boolean isLiveDomain = host != null && host.endsWith("realvisionacademy.site.je");
                                  if (!request.isForMainFrame() || !isLiveDomain || !"GET".equalsIgnoreCase(request.getMethod())) {
                                      return super.shouldInterceptRequest(view, request);
                                  }
                                  String urlStr = uri.toString();
                                  HttpURLConnection conn = null;
                                  try {
                                      conn = (HttpURLConnection) new URL(urlStr).openConnection();
                                      conn.setConnectTimeout(8000);
                                      conn.setReadTimeout(12000);
                                      // Bug fix (URL/WebView mismatch): this used to be
                                      // setInstanceFollowRedirects(true). That made HttpURLConnection
                                      // silently chase a server-side redirect (e.g.
                                      // /other_dashboard -> /natural_dashboard.php) itself, entirely
                                      // outside the WebView. The response body that came back was the
                                      // REAL page's HTML, but the WebView had only ever been told
                                      // about the ORIGINAL request — so window.location.href,
                                      // pathname, any "copy link"/share feature, and relative
                                      // asset/AJAX paths on the page all kept pointing at
                                      // /other_dashboard forever, never the page that was actually
                                      // showing. Redirects are now followed manually below, one hop
                                      // at a time, by handing each hop to WebView as its own real
                                      // navigation (view.loadUrl) instead of hiding it inside a
                                      // background HTTP client — so the WebView's address always
                                      // matches what's on screen, and relative paths on a future
                                      // sub-folder page would resolve correctly too.
                                      conn.setInstanceFollowRedirects(false);
                                      for (Map.Entry<String, String> h : request.getRequestHeaders().entrySet()) {
                                          conn.setRequestProperty(h.getKey(), h.getValue());
                                      }
                                      String cookie = CookieManager.getInstance().getCookie(urlStr);
                                      if (cookie != null) conn.setRequestProperty("Cookie", cookie);

                                      int code = conn.getResponseCode();
                                      List<String> setCookies = conn.getHeaderFields().get("Set-Cookie");
                                      if (setCookies != null) {
                                          for (String sc : setCookies) CookieManager.getInstance().setCookie(urlStr, sc);
                                          CookieManager.getInstance().flush();
                                      }

                                      // Manual redirect handling: resolve Location against the
                                      // current URL (it may be relative or absolute), then hand it
                                      // to the WebView as a brand-new top-level navigation. That
                                      // re-enters this same method for the redirected URL, so the
                                      // address bar / window.location / offline cache key all end up
                                      // keyed on the REAL destination page, not the gateway URL.
                                      if (code >= 300 && code < 400) {
                                          String location = conn.getHeaderField("Location");
                                          if (location != null) {
                                              String resolved = new URL(new URL(urlStr), location).toString();
                                              // Simple loop guard: if the chain of redirects starting
                                              // from this navigation keeps bouncing without making
                                              // progress, stop forwarding and fall through to whatever
                                              // is cached instead of hammering the server forever.
                                              if (resolved.equals(urlStr) || redirectHopCount(resolved) > MAX_REDIRECTS) {
                                                  byte[] cachedLoop = offlineCacheGetBytes(urlStr);
                                                  if (cachedLoop != null) {
                                                      String cachedLoopMime = offlineCacheGetMime(urlStr);
                                                      return new WebResourceResponse(cachedLoopMime != null ? cachedLoopMime : "text/html", "UTF-8", new ByteArrayInputStream(cachedLoop));
                                                  }
                                                  return null;
                                              }
                                              final String finalResolved = resolved;
                                              runOnUiThread(() -> view.loadUrl(finalResolved));
                                              // Swallow the original request with an empty response so
                                              // WebView doesn't also try to render the 3xx body itself;
                                              // the loadUrl() above is the navigation that actually
                                              // counts, and it will report the correct final URL.
                                              return new WebResourceResponse("text/plain", "UTF-8", new ByteArrayInputStream(new byte[0]));
                                          }
                                      }

                                      InputStream stream = (code >= 200 && code < 400) ? conn.getInputStream() : conn.getErrorStream();
                                      byte[] data = readAllBytes(stream);
                                      String contentType = conn.getContentType();
                                      String mime = (contentType != null && contentType.contains("/")) ? contentType.split(";")[0].trim() : "text/html";
                                      if (code >= 200 && code < 300) {
                                          // urlStr is now always the REAL, final URL — redirects are
                                          // no longer followed silently inside this connection (see
                                          // fix above), so there is no separate "gateway URL" vs
                                          // "final URL" to reconcile here anymore.
                                          redirectHops.remove(urlStr);
                                          offlineCachePut(urlStr, mime, data);
                                          getSharedPreferences("realvision_prefs", MODE_PRIVATE)
                                              .edit().putString("last_page_url", urlStr).apply();
                                      }
                                      return new WebResourceResponse(mime, "UTF-8", new ByteArrayInputStream(data));
                                  } catch (Exception e) {
                                      if (urlStr.equals(OFFLINE_ENTRY_URL)) {
                                          String lastUrl = getSharedPreferences("realvision_prefs", MODE_PRIVATE)
                                              .getString("last_page_url", null);
                                          if (lastUrl != null) {
                                              byte[] lastCached = offlineCacheGetBytes(lastUrl);
                                              if (lastCached != null) {
                                                  String lastMime = offlineCacheGetMime(lastUrl);
                                                  return new WebResourceResponse(lastMime != null ? lastMime : "text/html", "UTF-8", new ByteArrayInputStream(lastCached));
                                              }
                                          }
                                      }
                                      byte[] cached = offlineCacheGetBytes(urlStr);
                                      if (cached != null) {
                                          String cachedMime = offlineCacheGetMime(urlStr);
                                          return new WebResourceResponse(cachedMime != null ? cachedMime : "text/html", "UTF-8", new ByteArrayInputStream(cached));
                                      }
                                      // 44: Custom offline fallback page (replaces Chrome's default
                                      // net::ERR_NAME_NOT_RESOLVED screen). This only fires for the
                                      // rare race shouldOverrideUrlLoading doesn't catch (request
                                      // looked reachable at pre-flight but failed once actually sent),
                                      // or a cold start with zero cache at all — so instead of letting
                                      // WebView show its raw browser error, we hand back our own
                                      // branded "not saved offline" page. Shared with onReceivedError
                                      // below via offlineFallbackHtml() so there is exactly one place
                                      // Chromium's native error UI could ever slip through, and it's
                                      // covered too.
                                      return new WebResourceResponse("text/html", "UTF-8",
                                          new ByteArrayInputStream(offlineFallbackHtml().getBytes(StandardCharsets.UTF_8)));
                                  } finally {
                                      // Bug fix (connection leak): conn was previously never
                                      // disconnected on either the success or the exception path.
                                      // HttpURLConnection pools/holds sockets under the hood, so
                                      // repeated navigation without this leaked one socket per page
                                      // view — over a long session, this exhausted available
                                      // connections and caused slowdowns or crashes. disconnect()
                                      // here runs on every exit from the method (return or throw).
                                      if (conn != null) {
                                          conn.disconnect();
                                      }
                                  }
                              }
                          });
                      }

                      // 19-20: Root / USB-debug detection warning
                      if (isRooted()) {
                          Toast.makeText(this, "ማስጠንቀቂያ፡ ስልኩ root የተደረገ ነው", Toast.LENGTH_LONG).show();
                      }
                      if (isUsbDebuggingOn()) {
                          Toast.makeText(this, "ማስጠንቀቂያ፡ USB Debugging በርቷል", Toast.LENGTH_LONG).show();
                      }
                      // 36: Emulator detection warning
                      if (isEmulator()) {
                          Toast.makeText(this, "ማስጠንቀቂያ፡ emulator ላይ እየሮጠ ነው", Toast.LENGTH_LONG).show();
                      }

                      // 21: Network check + bilingual toast
                      if (!isNetworkAvailable()) {
                          Toast.makeText(this, "የኢንተርኔት ግንኙነት የለም / No internet connection", Toast.LENGTH_LONG).show();
                      }

                      // 32: Telegram-style network status banner
                      setupNetworkBanner();

                      // 33: Real-internet (package/data) check, polled periodically
                      connectivityHandler.post(periodicConnectivityCheck);

                      // 34: VPN detection on launch
                      checkVpnAndPrompt();

                      // 37: Force-update check against remote version JSON
                      checkForForceUpdate();

                      // 38: App-rating prompt after a few launches
                      maybePromptRating();

                      // 45a: Prepare (hidden) the biometric lock overlay used by the
                      // session-timeout check in onResume below.
                      setupLockOverlay();

                      // 48: Handle a tap on a long-press app shortcut (e.g. "Quiz") that
                      // cold-started the app — jumps straight to that shortcut's URL
                      // instead of the default dashboard gateway.
                      handleShortcutIntent(getIntent());
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  // 48a: App shortcut tapped while the app was already running (not a
                  // cold start) — same handling, just re-entered via onNewIntent instead.
                  setIntent(intent);
                  handleShortcutIntent(intent);
              }

              // 48b: Reads the "shortcut_url" extra set by res/xml/shortcuts.xml (see the
              // "Create app shortcuts" build step) and, if present, navigates straight
              // there instead of the default gateway page.
              private void handleShortcutIntent(Intent intent) {
                  try {
                      if (intent == null) return;
                      String shortcutUrl = intent.getStringExtra("shortcut_url");
                      if (shortcutUrl == null || shortcutUrl.isEmpty()) return;
                      WebView webView = this.bridge != null ? this.bridge.getWebView() : null;
                      if (webView != null) {
                          webView.postDelayed(() -> webView.loadUrl(shortcutUrl), 300);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  // 45b: Timestamp the moment the app leaves the foreground — checked in
                  // onResume below to decide whether re-authentication is required.
                  lastBackgroundedAt = System.currentTimeMillis();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  try {
                      // 34a: Re-check VPN when returning from Settings
                      checkVpnAndPrompt();

                      // 45c: If the app was backgrounded longer than SESSION_TIMEOUT_MS,
                      // require biometric/device-credential auth before showing content
                      // again. lastBackgroundedAt == 0 means this is the very first
                      // onResume right after onCreate (cold start) — never lock then.
                      if (lastBackgroundedAt != 0
                              && System.currentTimeMillis() - lastBackgroundedAt >= SESSION_TIMEOUT_MS) {
                          requireReAuthentication();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              // --- Native offline cache helpers (feature 39) -----------------------

              // Must match the URL the bundled www/index.html gateway shell
              // redirects to on every cold start (see "Create local gateway
              // shell" step above).
              private static final String OFFLINE_ENTRY_URL = "https://realvisionacademy.site.je/other_dashboard";


              private File offlineCacheDir() {
                  File dir = new File(getFilesDir(), "offline_cache");
                  if (!dir.exists()) dir.mkdirs();
                  return dir;
              }

              private String offlineCacheKey(String url) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("MD5");
                      byte[] digest = md.digest(url.getBytes(StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      for (byte b : digest) sb.append(String.format("%02x", b));
                      return sb.toString();
                  } catch (Exception e) {
                      return String.valueOf(url.hashCode());
                  }
              }

              private void offlineCachePut(String url, String mime, byte[] data) {
                  try {
                      String key = offlineCacheKey(url);
                      File dir = offlineCacheDir();
                      try (FileOutputStream fos = new FileOutputStream(new File(dir, key + ".bin"))) {
                          fos.write(data);
                      }
                      try (FileOutputStream fos = new FileOutputStream(new File(dir, key + ".mime"))) {
                          fos.write((mime == null ? "text/html" : mime).getBytes(StandardCharsets.UTF_8));
                      }
                      pruneOfflineCacheIfNeeded(dir, 400);
                  } catch (Exception e) {
                      // Non-fatal — just means this page won't be available offline yet
                  }
              }

              private byte[] offlineCacheGetBytes(String url) {
                  try {
                      File f = new File(offlineCacheDir(), offlineCacheKey(url) + ".bin");
                      if (!f.exists()) return null;
                      try (FileInputStream fis = new FileInputStream(f)) {
                          return readAllBytes(fis);
                      }
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String offlineCacheGetMime(String url) {
                  try {
                      File f = new File(offlineCacheDir(), offlineCacheKey(url) + ".mime");
                      if (!f.exists()) return null;
                      try (FileInputStream fis = new FileInputStream(f)) {
                          return new String(readAllBytes(fis), StandardCharsets.UTF_8);
                      }
                  } catch (Exception e) {
                      return null;
                  }
              }

              // Keeps the native offline cache from growing without bound — deletes the
              // oldest entries once the file count passes maxFiles.
              private void pruneOfflineCacheIfNeeded(File dir, int maxFiles) {
                  File[] files = dir.listFiles();
                  if (files == null || files.length <= maxFiles) return;
                  java.util.Arrays.sort(files, (a, b) -> Long.compare(a.lastModified(), b.lastModified()));
                  int toDelete = files.length - maxFiles;
                  for (int i = 0; i < toDelete; i++) files[i].delete();
              }

              private byte[] readAllBytes(InputStream in) throws Exception {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                  return out.toByteArray();
              }

              // --- 50: Download-all-pages (native offline pre-fetch) -----------------
              // Same student-facing page set sw.js precaches on the web side, kept here
              // so the app can proactively warm offlineCachePut() for all of them at once
              // (instead of relying on the student having opened each one already).
              private static final String[] OFFLINE_PAGE_LIST = new String[] {
                  "other_dashboard", "homepage.php", "about.php", "achievements.php",
                  "adaptive_learning.php", "ai_tutor.php", "ask_teacher.php", "book_marks.php",
                  "calendar_sync.php", "career_guide.php", "certificates.php", "challenges.php",
                  "chapter_formulas_public.php", "chapter_notes.php", "courses.php",
                  "daily_challenge.php", "exam_tips.php", "flashcards.php", "formula_view.php",
                  "formulas.php", "forum.php", "language.php", "leaderboard.php",
                  "live_classes.php", "mock_exam.php", "my_notes.php", "notifications.php",
                  "past_exams.php", "payment_history.php", "practice.php", "profile.php",
                  "progress_report.php", "question_bank.php", "recommendations.php",
                  "rewards_store.php", "security.php", "settings.php", "student_view_note.php",
                  "study_buddy.php", "study_groups.php", "study_planner.php", "subscription.php",
                  "support_chat.php", "time_analytics.php", "university_guide.php",
                  "video_lessons.php", "vocabulary.php", "wallet.php", "your_id.php"
              };

              // Fetches one page over HTTP and writes it into the same native offline
              // cache shouldInterceptRequest reads from — so once this has run, opening
              // any of these pages offline works exactly as if the student had visited
              // it live first. Follows redirects automatically (unlike
              // shouldInterceptRequest's manual hop-by-hop handling above) since there is
              // no live WebView navigation here to keep in sync with the final URL —
              // only the resulting bytes matter, cached under both URLs just in case.
              private boolean fetchAndCachePage(String urlStr) {
                  HttpURLConnection conn = null;
                  try {
                      conn = (HttpURLConnection) new URL(urlStr).openConnection();
                      conn.setConnectTimeout(8000);
                      conn.setReadTimeout(12000);
                      conn.setInstanceFollowRedirects(true);
                      String cookie = CookieManager.getInstance().getCookie(urlStr);
                      if (cookie != null) conn.setRequestProperty("Cookie", cookie);

                      int code = conn.getResponseCode();
                      if (code < 200 || code >= 300) return false;

                      byte[] data = readAllBytes(conn.getInputStream());
                      String contentType = conn.getContentType();
                      String mime = (contentType != null && contentType.contains("/"))
                          ? contentType.split(";")[0].trim() : "text/html";

                      offlineCachePut(urlStr, mime, data);
                      String finalUrl = conn.getURL().toString();
                      if (!finalUrl.equals(urlStr)) offlineCachePut(finalUrl, mime, data);
                      return true;
                  } catch (Exception e) {
                      return false;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              // 44a: Single source of truth for the branded "not saved offline" page.
              // Used by shouldInterceptRequest's catch-block AND by onReceivedError below
              // — together these two are the only two places a failed load can end up, so
              // sharing this guarantees Chromium's own net::ERR_* error screen is never the
              // thing the student actually sees.
              private String offlineFallbackHtml() {
                  return "<!DOCTYPE html><html lang=\"am\"><head>"
                      + "<meta charset=\"UTF-8\">"
                      + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">"
                      + "<style>"
                      + "*{box-sizing:border-box;margin:0;padding:0;}"
                      + "html,body{height:100%;background:#0f172a;color:#f1f5f9;"
                      + "font-family:-apple-system,Roboto,'Noto Sans Ethiopic','Nyala',sans-serif;}"
                      + "#wrap{min-height:100%;display:flex;flex-direction:column;"
                      + "align-items:center;justify-content:center;text-align:center;padding:32px 24px;}"
                      + ".icon{font-size:48px;margin-bottom:18px;}"
                      + "h1{font-size:18px;font-weight:700;margin-bottom:10px;}"
                      + "p{color:#94a3b8;font-size:14px;max-width:320px;line-height:1.6;margin-bottom:24px;}"
                      + "button{background:#3b82f6;color:#fff;border:none;padding:12px 28px;"
                      + "border-radius:10px;font-size:15px;font-weight:600;}"
                      + "</style></head><body><div id=\"wrap\">"
                      + "<div class=\"icon\">📡</div>"
                      + "<h1>ገፁ አልተገኘም</h1>"
                      + "<p>ይህንን ገፅ online ላይ ሆነው አልተጠቀሙትም ስለዚህ ይመለሱ።</p>"
                      + "<button onclick=\"history.back()\">ተመለስ</button>"
                      + "</div></body></html>";
              }


              @Override
              public void onDestroy() {
                  super.onDestroy();
                  try {
                      if (networkCallback != null) {
                          ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                          if (cm != null) cm.unregisterNetworkCallback(networkCallback);
                      }
                      connectivityHandler.removeCallbacks(periodicConnectivityCheck);
                  } catch (Exception e) {
                      // ignore
                  }
              }

              // 40a: Chrome/YouTube-style animated top progress bar, pinned to the very
              // top. We don't have real byte-level progress (shouldInterceptRequest reads
              // the whole main-document response before handing it to the WebView, and
              // sub-resources load through the normal pipeline), so this fakes it the same
              // way most professional apps do: ease quickly up to ~90% while the page is
              // loading, then snap to 100% and fade out the instant it's done. See
              // startLoadingProgress()/finishLoadingProgress() below.
              private void setupTopProgressBar() {
                  topProgressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  topProgressBar.setIndeterminate(false);
                  topProgressBar.setMax(100);
                  topProgressBar.setProgress(0);
                  topProgressBar.setVisibility(View.GONE);

                  // Rounded brand-gradient fill (navy -> blue -> light blue) instead of a
                  // flat tint, so the bar reads as deliberate design rather than a stock
                  // system progress widget.
                  GradientDrawable barGradient = new GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      new int[]{ Color.parseColor("#0a2b4e"), Color.parseColor("#3b82f6"), Color.parseColor("#6fa8d8") }
                  );
                  barGradient.setCornerRadius(8f);
                  ClipDrawable barClip = new ClipDrawable(barGradient, Gravity.START, ClipDrawable.HORIZONTAL);
                  topProgressBar.setProgressDrawable(barClip);

                  float density = getResources().getDisplayMetrics().density;
                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      (int) (4 * density)
                  );
                  params.gravity = Gravity.TOP;
                  addContentView(topProgressBar, params);

                  // 40b: Small floating brand card — the Real Vision mark (pulsing) next
                  // to a slim circular spinner — centered near the top of the screen.
                  // Purely a native, in-memory view (no network/asset download involved):
                  // it fades + scales in on onPageStarted and back out on onPageFinished,
                  // giving page transitions a more deliberate, "branded" feel than the
                  // thin bar alone.
                  LinearLayout popup = new LinearLayout(this);
                  popup.setOrientation(LinearLayout.HORIZONTAL);
                  popup.setGravity(Gravity.CENTER_VERTICAL);
                  int padH = (int) (16 * density);
                  int padV = (int) (10 * density);
                  popup.setPadding(padH, padV, padH, padV);

                  GradientDrawable card = new GradientDrawable();
                  card.setColor(Color.parseColor("#E60b0518"));
                  card.setCornerRadius(28f * density);
                  card.setStroke((int) (1 * density), Color.parseColor("#333b82f6"));
                  popup.setBackground(card);
                  popup.setElevation(12f * density);

                  loadingPopupLogo = new ImageView(this);
                  int logoSize = (int) (26 * density);
                  LinearLayout.LayoutParams logoParams = new LinearLayout.LayoutParams(logoSize, logoSize);
                  logoParams.setMarginEnd((int) (10 * density));
                  loadingPopupLogo.setLayoutParams(logoParams);
                  try {
                      int logoResId = getResources().getIdentifier("app_logo", "drawable", getPackageName());
                      if (logoResId != 0) loadingPopupLogo.setImageResource(logoResId);
                  } catch (Exception e) {
                      // Missing drawable just means the popup shows the spinner alone.
                  }
                  popup.addView(loadingPopupLogo);

                  ProgressBar spinner = new ProgressBar(this);
                  int spinnerSize = (int) (18 * density);
                  LinearLayout.LayoutParams spinnerParams = new LinearLayout.LayoutParams(spinnerSize, spinnerSize);
                  spinner.setLayoutParams(spinnerParams);
                  spinner.getIndeterminateDrawable().setColorFilter(Color.parseColor("#6fa8d8"), android.graphics.PorterDuff.Mode.SRC_IN);
                  popup.addView(spinner);

                  popup.setVisibility(View.GONE);
                  popup.setAlpha(0f);
                  popup.setScaleX(0.85f);
                  popup.setScaleY(0.85f);

                  FrameLayout.LayoutParams popupParams = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  popupParams.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  popupParams.topMargin = (int) (28 * density);
                  addContentView(popup, popupParams);
                  loadingPopup = popup;
              }

              // Called from onPageStarted: reset to 0%, fade fully in, then glide up to 90%
              // over 4s with a decelerating curve (fast start, slow crawl) — never reaching
              // 100% on its own, so it always looks "alive" for however long the real load
              // actually takes, instead of stalling flat like a plain indeterminate spinner.
              private void startLoadingProgress() {
                  if (topProgressBar == null) return;
                  if (progressAnimator != null) progressAnimator.cancel();
                  topProgressBar.animate().cancel();
                  topProgressBar.setAlpha(1f);
                  topProgressBar.setProgress(0);
                  topProgressBar.setVisibility(View.VISIBLE);

                  progressAnimator = ValueAnimator.ofInt(0, 90);
                  progressAnimator.setDuration(4000);
                  progressAnimator.setInterpolator(new DecelerateInterpolator(1.5f));
                  progressAnimator.addUpdateListener(a -> topProgressBar.setProgress((int) a.getAnimatedValue()));
                  progressAnimator.start();

                  if (loadingPopup != null) {
                      loadingPopup.animate().cancel();
                      loadingPopup.setVisibility(View.VISIBLE);
                      loadingPopup.animate()
                          .alpha(1f)
                          .scaleX(1f)
                          .scaleY(1f)
                          .setDuration(220)
                          .setInterpolator(new OvershootInterpolator(1.8f))
                          .start();

                      if (popupPulseAnimator != null) popupPulseAnimator.cancel();
                      popupPulseAnimator = ObjectAnimator.ofPropertyValuesHolder(loadingPopupLogo,
                          PropertyValuesHolder.ofFloat("scaleX", 1f, 1.15f, 1f),
                          PropertyValuesHolder.ofFloat("scaleY", 1f, 1.15f, 1f));
                      popupPulseAnimator.setDuration(900);
                      popupPulseAnimator.setRepeatCount(ValueAnimator.INFINITE);
                      popupPulseAnimator.start();
                  }
              }

              // Called from onPageFinished: snap the remaining distance to 100% quickly
              // (200ms), hold briefly so the completed bar is visible, then fade out and
              // reset — ready for the next navigation.
              private void finishLoadingProgress() {
                  if (topProgressBar == null) return;
                  if (progressAnimator != null) progressAnimator.cancel();

                  ValueAnimator finishAnim = ValueAnimator.ofInt(topProgressBar.getProgress(), 100);
                  finishAnim.setDuration(200);
                  finishAnim.addUpdateListener(a -> topProgressBar.setProgress((int) a.getAnimatedValue()));
                  finishAnim.addListener(new AnimatorListenerAdapter() {
                      @Override
                      public void onAnimationEnd(Animator animation) {
                          topProgressBar.animate()
                              .alpha(0f)
                              .setStartDelay(150)
                              .setDuration(250)
                              .withEndAction(() -> {
                                  topProgressBar.setVisibility(View.GONE);
                                  topProgressBar.setProgress(0);
                                  topProgressBar.setAlpha(1f);
                              })
                              .start();
                      }
                  });
                  finishAnim.start();

                  if (loadingPopup != null) {
                      if (popupPulseAnimator != null) popupPulseAnimator.cancel();
                      loadingPopup.animate().cancel();
                      loadingPopup.animate()
                          .alpha(0f)
                          .scaleX(0.85f)
                          .scaleY(0.85f)
                          .setStartDelay(150)
                          .setDuration(220)
                          .setInterpolator(new AccelerateInterpolator())
                          .withEndAction(() -> loadingPopup.setVisibility(View.GONE))
                          .start();
                  }
              }

              // 32a: Sets up a top banner that mimics Telegram's connection status text —
              // slim, pinned to the very top, doesn't push or overlay page content below it.
              private void setupNetworkBanner() {
                  float density = getResources().getDisplayMetrics().density;
                  networkBanner = new TextView(this);
                  networkBanner.setTextColor(Color.WHITE);
                  networkBanner.setTextSize(12);
                  networkBanner.setGravity(Gravity.CENTER);
                  networkBanner.setBackgroundColor(Color.parseColor("#2b2140"));
                  networkBanner.setPadding(0, (int) (7 * density), 0, (int) (7 * density));
                  networkBanner.setVisibility(View.GONE);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  params.gravity = Gravity.TOP;
                  addContentView(networkBanner, params);

                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm == null) return;

                  NetworkRequest request = new NetworkRequest.Builder().build();
                  networkCallback = new ConnectivityManager.NetworkCallback() {
                      @Override
                      public void onLost(Network network) {
                          hasRealInternetSignal = false;
                          runOnUiThread(() -> setBanner(offlineBannerText(), true));
                      }

                      @Override
                      public void onUnavailable() {
                          hasRealInternetSignal = false;
                          runOnUiThread(() -> setBanner(offlineBannerText(), true));
                      }

                      @Override
                      public void onAvailable(Network network) {
                          runOnUiThread(() -> {
                              setBanner(BANNER_CONNECTING, true);
                              bannerHandler.postDelayed(() -> {
                                  setBanner("Updating...", true);
                                  WebView webView = bridge != null ? bridge.getWebView() : null;
                                  if (webView != null) webView.reload();
                                  bannerHandler.postDelayed(() -> checkRealInternet(), 1200);
                              }, 800);
                          });
                      }
                  };

                  cm.registerNetworkCallback(request, networkCallback);
              }

              private void setBanner(String text, boolean visible) {
                  if (networkBanner == null) return;
                  if (text != null) networkBanner.setText(text);
                  networkBanner.setVisibility(visible ? View.VISIBLE : View.GONE);
              }

              // 33a: Confirms whether the connected network actually reaches the internet
              // (as opposed to just being "connected" per Android, which is also true when
              // the SIM's data package/balance has run out). Does this by quickly attempting
              // a socket connection to google.com; it cannot read the phone's data balance
              // directly, so this is only a proxy signal for "no real internet", which is the
              // most common cause of that condition.
              private void checkRealInternet() {
                  if (isAirplaneModeOn()) {
                      hasRealInternetSignal = false;
                      runOnUiThread(() -> setBanner(BANNER_FLIGHT_MODE, true));
                      return;
                  }
                  if (!isNetworkAvailable()) {
                      hasRealInternetSignal = false;
                      runOnUiThread(() -> setBanner(BANNER_OFFLINE, true));
                      return;
                  }
                  // Network reports "connected" but that alone doesn't mean it reaches the
                  // internet (weak signal, or the SIM's data package/balance ran out) — show
                  // "Connecting..." immediately while the real probe below confirms either way.
                  runOnUiThread(() -> setBanner(BANNER_CONNECTING, true));
                  new Thread(() -> {
                      boolean hasRealInternet;
                      try {
                          java.net.Socket socket = new java.net.Socket();
                          socket.connect(new java.net.InetSocketAddress("google.com", 443), 2500);
                          socket.close();
                          hasRealInternet = true;
                      } catch (Exception e) {
                          hasRealInternet = false;
                      }
                      final boolean result = hasRealInternet;
                      // Captured BEFORE we overwrite hasRealInternetSignal below, so this is
                      // the state as of the previous check — used only to detect the
                      // offline -> online transition (see the new branch below).
                      final boolean wasOffline = !hasRealInternetSignal;
                      hasRealInternetSignal = result;
                      runOnUiThread(() -> {
                          if (isAirplaneModeOn()) {
                              setBanner(BANNER_FLIGHT_MODE, true);
                          } else if (!isNetworkAvailable()) {
                              setBanner(BANNER_OFFLINE, true);
                          } else if (!result) {
                              // Weak signal / exhausted data package — stay on "Connecting..."
                              // rather than a technical "check your package" message.
                              setBanner(BANNER_CONNECTING, true);
                          } else if (wasOffline) {
                              // Internet just came back — show a brief confirmation instead of
                              // silently hiding the banner, then fade it out on its own after a
                              // couple of seconds (Telegram/WhatsApp-style).
                              setBanner(BANNER_ONLINE, true);
                              bannerHandler.postDelayed(() -> setBanner(null, false), 1800);
                          } else {
                              setBanner(null, false);
                          }
                      });
                  }).start();
              }

              // 34a: Detects an active VPN connection and, if found, shows a blocking dialog.
              private boolean isVpnActive() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return false;
                      Network network = cm.getActiveNetwork();
                      if (network == null) return false;
                      NetworkCapabilities capabilities = cm.getNetworkCapabilities(network);
                      return capabilities != null && capabilities.hasTransport(NetworkCapabilities.TRANSPORT_VPN);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void checkVpnAndPrompt() {
                  if (vpnDialogShowing || isFinishing()) return;
                  if (isVpnActive()) {
                      showVpnDialog();
                  }
              }

              private void showVpnDialog() {
                  vpnDialogShowing = true;
                  new AlertDialog.Builder(this)
                      .setTitle("VPN Detected")
                      .setMessage("VPN ተገኝቷል። ይህን መተግበሪያ ለመጠቀም እባክዎ VPN ን ያጥፉ።\nA VPN was detected. Please disable it to use this app.\n\nOpen VPN settings now?")
                      .setCancelable(false)
                      .setPositiveButton("Yes", (dialog, which) -> {
                          vpnDialogShowing = false;
                          try {
                              startActivity(new Intent(Settings.ACTION_VPN_SETTINGS));
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      })
                      .setNegativeButton("No", (dialog, which) -> {
                          vpnDialogShowing = false;
                          finish();
                      })
                      .show();
              }

              // 43b: Shown instead of navigating when the student is offline AND the
              // tapped page was never opened while online (so there is nothing saved to
              // show them). Two explicit choices only, no silent behavior:
              //   Close  -> just dismiss, student stays exactly where they were.
              //   Retry  -> re-check the network right now and, if it's actually back,
              //             immediately re-attempt the same navigation; otherwise the
              //             dialog reappears so the student knows the retry itself failed.
              private void showOfflineUnavailableDialog(WebView view, String targetUrl) {
                  if (offlineDialogShowing || isFinishing()) return;
                  offlineDialogShowing = true;
                  new AlertDialog.Builder(this)
                      .setTitle("Not Available Offline / ከመስመር ውጭ አይገኝም")
                      .setMessage("ይህንን ገፅ online ሆነው ስላልተጠቀሙበት አሁን ከመስመር ውጭ ሆነው መክፈት አይችሉም።\n\n" +
                          "You can't use this because you haven't used it while online.")
                      .setCancelable(false)
                      .setPositiveButton("Retry", (dialog, which) -> {
                          offlineDialogShowing = false;
                          // Force a fresh check instead of trusting the last periodic probe,
                          // so tapping Retry right after Wi-Fi/data comes back doesn't get
                          // rejected again on stale state.
                          new Thread(() -> {
                              boolean reachable;
                              try {
                                  java.net.Socket socket = new java.net.Socket();
                                  socket.connect(new java.net.InetSocketAddress("google.com", 443), 2500);
                                  socket.close();
                                  reachable = true;
                              } catch (Exception e) {
                                  reachable = false;
                              }
                              hasRealInternetSignal = reachable;
                              final boolean isBackOnline = reachable && isNetworkAvailable();
                              runOnUiThread(() -> {
                                  if (isBackOnline) {
                                      setBanner(null, false);
                                      view.loadUrl(targetUrl);
                                  } else {
                                      setBanner(offlineBannerText(), true);
                                      showOfflineUnavailableDialog(view, targetUrl);
                                  }
                              });
                          }).start();
                      })
                      .setNegativeButton("Close", (dialog, which) -> {
                          offlineDialogShowing = false;
                      })
                      .show();
              }

              // 22-23: Double-back-to-exit + WebView history back
              @Override
              public void onBackPressed() {
                  WebView webView = this.bridge.getWebView();
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  if (doubleBackToExitPressedOnce) {
                      super.onBackPressed();
                      return;
                  }
                  this.doubleBackToExitPressedOnce = true;
                  Toast.makeText(this, "ለመውጣት ደግመው ይንኩ / Tap again to exit", Toast.LENGTH_SHORT).show();
                  vibrateShort();
                  exitHandler.postDelayed(() -> doubleBackToExitPressedOnce = false, 2000);
              }

              // 24: Vibration feedback
              private void vibrateShort() {
                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v == null) return;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(50, VibrationEffect.DEFAULT_AMPLITUDE));
                      } else {
                          v.vibrate(50);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              // 25: Network check helper
              private boolean isNetworkAvailable() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      NetworkInfo activeNetwork = cm != null ? cm.getActiveNetworkInfo() : null;
                      return activeNetwork != null && activeNetwork.isConnectedOrConnecting();
                  } catch (Exception e) {
                      return true;
                  }
              }

              // 32a: Top banner text — one source of truth for all four states, used
              // by checkRealInternet(), shouldOverrideUrlLoading, and the
              // ConnectivityManager.NetworkCallback below, so the wording never drifts
              // out of sync between call sites.
              //   1. Flight mode ON                              -> BANNER_FLIGHT_MODE
              //   2. Flight mode OFF, no active network (data/WiFi both off) -> BANNER_OFFLINE
              //   3. Network active but no real internet (weak signal / 0 data package) -> BANNER_CONNECTING
              //   4. Everything working (real internet confirmed)  -> BANNER_ONLINE (flashed briefly, then hidden)
              private static final String BANNER_FLIGHT_MODE = "FLIGHT MODE IS ON, TURN IT OFF TO CONTINUE";
              private static final String BANNER_OFFLINE = "YOU ARE OFFLINE, SOME FEATURES DOES NOT WORK";
              private static final String BANNER_CONNECTING = "Connecting...";
              private static final String BANNER_ONLINE = "YOU ARE ONLINE";

              // 32b: True only when the device's Airplane/Flight mode toggle itself is on
              // — distinct from "just no active network", so the banner can tell the
              // student exactly what to turn off instead of a generic offline message.
              private boolean isAirplaneModeOn() {
                  try {
                      return Settings.Global.getInt(getContentResolver(), Settings.Global.AIRPLANE_MODE_ON, 0) != 0;
                  } catch (Exception e) {
                      return false;
                  }
              }

              // 32c: Resolves the correct "not connected" banner text for the current
              // instant. Only meaningful when NOT truly online — callers already know
              // that from context (isNetworkAvailable()/hasRealInternetSignal), this
              // just picks between the flight-mode-specific and generic offline wording.
              private String offlineBannerText() {
                  return isAirplaneModeOn() ? BANNER_FLIGHT_MODE : BANNER_OFFLINE;
              }

              // 26: Root detection helper
              private boolean isRooted() {
                  try {
                      String[] paths = {
                          "/system/app/Superuser.apk", "/sbin/su", "/system/bin/su",
                          "/system/xbin/su", "/data/local/xbin/su", "/data/local/bin/su",
                          "/system/sd/xbin/su", "/system/bin/failsafe/su", "/data/local/su"
                      };
                      for (String path : paths) {
                          if (new java.io.File(path).exists()) return true;
                      }
                  } catch (Exception e) {
                      // ignore
                  }
                  return false;
              }

              // 27: USB debugging detection helper
              private boolean isUsbDebuggingOn() {
                  try {
                      return android.provider.Settings.Secure.getInt(
                          getContentResolver(),
                          android.provider.Settings.Global.ADB_ENABLED, 0) == 1;
                  } catch (Exception e) {
                      return false;
                  }
              }

              // 36a: Emulator detection helper
              private boolean isEmulator() {
                  try {
                      return Build.FINGERPRINT.startsWith("generic")
                          || Build.FINGERPRINT.startsWith("unknown")
                          || Build.MODEL.contains("google_sdk")
                          || Build.MODEL.contains("Emulator")
                          || Build.MODEL.contains("Android SDK built for x86")
                          || Build.MANUFACTURER.contains("Genymotion")
                          || (Build.BRAND.startsWith("generic") && Build.DEVICE.startsWith("generic"))
                          || "google_sdk".equals(Build.PRODUCT);
                  } catch (Exception e) {
                      return false;
                  }
              }

              // 37a: TODO — replace with your real hosted JSON, e.g.:
              // {"latestVersionCode": 3, "forceUpdate": true, "playStoreUrl": "https://play.google.com/store/apps/details?id=..."}
              private static final String UPDATE_CHECK_URL = "https://example.com/realvision-version.json";

              private void checkForForceUpdate() {
                  new Thread(() -> {
                      try {
                          URL url = new URL(UPDATE_CHECK_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(4000);
                          conn.setReadTimeout(4000);
                          BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) sb.append(line);
                          reader.close();

                          JSONObject json = new JSONObject(sb.toString());
                          int latestVersionCode = json.optInt("latestVersionCode", -1);
                          boolean forceUpdate = json.optBoolean("forceUpdate", false);
                          String storeUrl = json.optString(
                              "playStoreUrl",
                              "https://play.google.com/store/apps/details?id=" + getPackageName()
                          );
                          int currentVersionCode = getVersionCode();

                          if (forceUpdate && latestVersionCode > currentVersionCode) {
                              runOnUiThread(() -> showForceUpdateDialog(storeUrl));
                          } else if (latestVersionCode > currentVersionCode) {
                              // 47b: A newer version exists but the server didn't mark it as
                              // mandatory — show the small dismissible bottom bar instead of
                              // the blocking dialog, so students aren't interrupted.
                              runOnUiThread(() -> showSoftUpdateBanner(storeUrl));
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              private int getVersionCode() {
                  try {
                      PackageInfo pInfo = getPackageManager().getPackageInfo(getPackageName(), 0);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          return (int) pInfo.getLongVersionCode();
                      }
                      return pInfo.versionCode;
                  } catch (Exception e) {
                      return -1;
                  }
              }

              private void showForceUpdateDialog(String storeUrl) {
                  if (isFinishing()) return;
                  new AlertDialog.Builder(this)
                      .setTitle("Update Required / ማሻሻያ ያስፈልጋል")
                      .setMessage("አዲስ ስሪት አለ፣ ለመቀጠል እባክዎ ያዘምኑ።\nA new version is available. Please update to continue.")
                      .setCancelable(false)
                      .setPositiveButton("Update", (dialog, which) -> {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(storeUrl)));
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                          finish();
                      })
                      .show();
              }

              // 38a: Prompts for a Play Store rating after the 5th launch, once only
              private void maybePromptRating() {
                  try {
                      SharedPreferences prefs = getSharedPreferences("realvision_prefs", MODE_PRIVATE);
                      int launches = prefs.getInt("launch_count", 0) + 1;
                      prefs.edit().putInt("launch_count", launches).apply();

                      boolean alreadyHandled = prefs.getBoolean("rated_or_dismissed", false);
                      if (!alreadyHandled && launches == 5) {
                          showRatingDialog(prefs);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void showRatingDialog(SharedPreferences prefs) {
                  if (isFinishing()) return;
                  new AlertDialog.Builder(this)
                      .setTitle("Enjoying the app? / መተግበሪያውን ወደዱት?")
                      .setMessage("Play Store ላይ 5 ኮከብ ቢሰጡን ደስ ይለናል!\nWe'd love a 5-star rating on the Play Store!")
                      .setPositiveButton("Rate Now", (dialog, which) -> {
                          prefs.edit().putBoolean("rated_or_dismissed", true).apply();
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + getPackageName())));
                          } catch (Exception e) {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=" + getPackageName())));
                          }
                      })
                      .setNegativeButton("Later", (dialog, which) -> {
                          prefs.edit().putBoolean("rated_or_dismissed", true).apply();
                      })
                      .show();
              }

              // 35a: Native share, callable from the web page as: AndroidShare.shareText("some text")
              //
              // Bug fix (unrestricted JS bridge): addJavascriptInterface() exposes this
              // object to EVERY page the WebView ever loads into the same frame, not
              // just the intended app domain — allowNavigation narrows which hosts the
              // WebView will navigate to at all, but it does not stop a compromised or
              // injected script on an already-loaded page (e.g. via a mixed-content
              // resource, a malicious ad, or a future navigation bug) from calling
              // window.AndroidShare directly. shareText() only launches a share sheet
              // today, which is low severity, but the interface itself should never be
              // trusted based on domain restriction alone. isCallOriginTrusted() re-checks
              // the WebView's CURRENT top-level URL against the same allow-list at the
              // moment of the call, so the bridge simply no-ops for any other origin.
              private static final String[] TRUSTED_JS_BRIDGE_HOSTS = {
                  "realvisionacademy.site.je"
              };

              private boolean isCallOriginTrusted() {
                  try {
                      WebView webView = this.bridge != null ? this.bridge.getWebView() : null;
                      String currentUrl = webView != null ? webView.getUrl() : null;
                      if (currentUrl == null) return false;
                      // "localhost" covers the bundled www/index.html gateway shell, which
                      // Capacitor serves under androidScheme "https" at https://localhost —
                      // it never calls the bridge itself, but is included so a fresh cold
                      // start (before the live page has loaded) doesn't spuriously log a
                      // rejected call.
                      String host = Uri.parse(currentUrl).getHost();
                      if (host == null) return false;
                      if (host.equals("localhost")) return true;
                      for (String trusted : TRUSTED_JS_BRIDGE_HOSTS) {
                          if (host.equals(trusted) || host.endsWith("." + trusted)) return true;
                      }
                      return false;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private class WebAppInterface {
                  @JavascriptInterface
                  public void shareText(String text) {
                      if (!isCallOriginTrusted()) {
                          return;
                      }
                      runOnUiThread(() -> {
                          try {
                              Intent shareIntent = new Intent(Intent.ACTION_SEND);
                              shareIntent.setType("text/plain");
                              shareIntent.putExtra(Intent.EXTRA_TEXT, text);
                              startActivity(Intent.createChooser(shareIntent, "Share via"));
                          } catch (Exception e) {
                              e.printStackTrace();
                          }
                      });
                  }

                  // 50: Kicks off downloading every page in OFFLINE_PAGE_LIST in the
                  // background, 4 at a time. Progress/result are pushed back to the page
                  // via window.onOfflineDownloadProgress(done,total,failed) and
                  // window.onOfflineDownloadComplete(downloaded,total,failed) — define
                  // those two functions on the web side to drive a progress bar/toast.
                  // Ignored if a download is already running, so a double-tap on the
                  // button can't start two overlapping runs.
                  @JavascriptInterface
                  public void downloadAllPages() {
                      if (!isCallOriginTrusted()) {
                          return;
                      }
                      if (offlineDownloadPool != null && !offlineDownloadPool.isShutdown()) {
                          return;
                      }
                      offlineDownloadPool = Executors.newFixedThreadPool(4);
                      final int total = OFFLINE_PAGE_LIST.length;
                      final AtomicInteger done = new AtomicInteger(0);
                      final AtomicInteger failed = new AtomicInteger(0);

                      for (String path : OFFLINE_PAGE_LIST) {
                          final String url = "https://realvisionacademy.site.je/" + path;
                          offlineDownloadPool.execute(() -> {
                              boolean ok = fetchAndCachePage(url);
                              int d = done.incrementAndGet();
                              if (!ok) failed.incrementAndGet();
                              final int f = failed.get();
                              // WebAppInterface has no webView field of its own (every other
                              // method in MainActivity re-fetches it locally via
                              // bridge.getWebView() instead) — do the same here, qualified
                              // with MainActivity.this since we're inside an inner class.
                              runOnUiThread(() -> {
                                  WebView wv = MainActivity.this.bridge != null
                                      ? MainActivity.this.bridge.getWebView() : null;
                                  if (wv == null) return;
                                  wv.evaluateJavascript(
                                      "window.onOfflineDownloadProgress && window.onOfflineDownloadProgress("
                                          + d + "," + total + "," + f + ");",
                                      null
                                  );
                              });
                              if (d == total) {
                                  final int finalFailed = failed.get();
                                  runOnUiThread(() -> {
                                      WebView wv = MainActivity.this.bridge != null
                                          ? MainActivity.this.bridge.getWebView() : null;
                                      if (wv == null) return;
                                      wv.evaluateJavascript(
                                          "window.onOfflineDownloadComplete && window.onOfflineDownloadComplete("
                                              + (total - finalFailed) + "," + total + "," + finalFailed + ");",
                                          null
                                      );
                                  });
                                  offlineDownloadPool.shutdown();
                              }
                          });
                      }
                  }

                  // How many of OFFLINE_PAGE_LIST are already saved offline right now —
                  // lets the web side show "12/49 pages downloaded" on page load, before
                  // the student has tapped the download button this session.
                  @JavascriptInterface
                  public int getDownloadedPageCount() {
                      if (!isCallOriginTrusted()) {
                          return 0;
                      }
                      int count = 0;
                      for (String path : OFFLINE_PAGE_LIST) {
                          String url = "https://realvisionacademy.site.je/" + path;
                          if (offlineCacheGetBytes(url) != null) count++;
                      }
                      return count;
                  }

                  @JavascriptInterface
                  public int getTotalPageCount() {
                      return OFFLINE_PAGE_LIST.length;
                  }
              }

              // ======================================================================
              // 45: Biometric app-lock + session timeout
              // ======================================================================

              // Builds (once) a full-screen, non-dismissable overlay that hides the
              // WebView behind a solid background + "Unlock" button while a biometric
              // check is pending — combined with FLAG_SECURE above, this also means a
              // backgrounded/recent-apps preview never shows the last visible page.
              private void setupLockOverlay() {
                  if (lockOverlay != null) return;
                  LinearLayout overlay = new LinearLayout(this);
                  overlay.setOrientation(LinearLayout.VERTICAL);
                  overlay.setGravity(Gravity.CENTER);
                  overlay.setBackgroundColor(Color.parseColor("#0b0518"));
                  overlay.setVisibility(View.GONE);
                  overlay.setClickable(true);
                  overlay.setFocusable(true);

                  TextView label = new TextView(this);
                  label.setText("🔒\nለመቀጠል እባክዎ ይክፈቱ\nUnlock to continue");
                  label.setTextColor(Color.WHITE);
                  label.setGravity(Gravity.CENTER);
                  label.setTextSize(16);
                  label.setPadding(0, 0, 0, 32);
                  overlay.addView(label);

                  Button unlockButton = new Button(this);
                  unlockButton.setText("Unlock");
                  unlockButton.setOnClickListener(v -> showBiometricPrompt());
                  overlay.addView(unlockButton);

                  addContentView(overlay, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  lockOverlay = overlay;
              }

              // Called from onResume when the idle-timeout has elapsed. Shows the
              // overlay immediately (hiding page content) then prompts biometrics.
              private void requireReAuthentication() {
                  if (lockOverlayShowing || lockOverlay == null) return;
                  lockOverlayShowing = true;
                  lockOverlay.setVisibility(View.VISIBLE);
                  showBiometricPrompt();
              }

              private void showBiometricPrompt() {
                  try {
                      BiometricManager biometricManager = BiometricManager.from(this);
                      int canAuth = biometricManager.canAuthenticate(
                          BiometricManager.Authenticators.BIOMETRIC_WEAK
                              | BiometricManager.Authenticators.DEVICE_CREDENTIAL
                      );
                      if (canAuth != BiometricManager.BIOMETRIC_SUCCESS) {
                          // No fingerprint/face/PIN/pattern set up on this device at all —
                          // there is nothing to authenticate against, so don't trap the
                          // student behind a lock screen they can never pass. Just let
                          // them straight in.
                          dismissLockOverlay();
                          return;
                      }

                      BiometricPrompt.PromptInfo promptInfo = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle("RealVision Academy")
                          .setSubtitle("ለመቀጠል ማንነትዎን ያረጋግጡ / Verify to continue")
                          .setAllowedAuthenticators(
                              BiometricManager.Authenticators.BIOMETRIC_WEAK
                                  | BiometricManager.Authenticators.DEVICE_CREDENTIAL
                          )
                          .build();

                      BiometricPrompt prompt = new BiometricPrompt(this, biometricExecutor,
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override
                              public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                  runOnUiThread(MainActivity.this::dismissLockOverlay);
                              }

                              @Override
                              public void onAuthenticationError(int errorCode, CharSequence errString) {
                                  // Leaves the overlay up — student can retap "Unlock" to try
                                  // again. Deliberately does NOT finish()/exit the app: a
                                  // cancelled or failed prompt shouldn't force-close a
                                  // student's session, just keep them at the lock screen.
                              }
                          });
                      prompt.authenticate(promptInfo);
                  } catch (Exception e) {
                      // Biometric hardware/API unavailable for some reason — fail open
                      // rather than permanently locking a student out of the app.
                      e.printStackTrace();
                      dismissLockOverlay();
                  }
              }

              private void dismissLockOverlay() {
                  lockOverlayShowing = false;
                  if (lockOverlay != null) lockOverlay.setVisibility(View.GONE);
              }

              // ======================================================================
              // 46: Pull-to-refresh (manual, no extra layout dependency needed)
              // ======================================================================

              private void setupPullIndicator() {
                  ProgressBar spinner = new ProgressBar(this);
                  spinner.setVisibility(View.GONE);
                  float density = getResources().getDisplayMetrics().density;
                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      (int) (36 * density), (int) (36 * density)
                  );
                  params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  params.topMargin = (int) (16 * density);
                  addContentView(spinner, params);
                  pullIndicator = spinner;
              }

              // Tracks a downward drag starting from the very top of the page (scrollY
              // == 0) and, once it passes PULL_TRIGGER_DP, reloads the page on release
              // — the same gesture students already know from Instagram/Twitter/Gmail.
              // Deliberately ignores drags that don't start at scrollY == 0, so normal
              // in-page scrolling is never intercepted or made to feel "sticky".
              private void handlePullToRefreshTouch(WebView webView, MotionEvent event) {
                  float density = getResources().getDisplayMetrics().density;
                  switch (event.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          pullStartY = event.getRawY();
                          pullTracking = webView.getScrollY() == 0;
                          break;
                      case MotionEvent.ACTION_MOVE:
                          if (!pullTracking || pullStartY < 0) break;
                          float dy = event.getRawY() - pullStartY;
                          if (dy > 0 && webView.getScrollY() == 0 && pullIndicator != null) {
                              pullIndicator.setVisibility(View.VISIBLE);
                              float progress = Math.min(dy / (PULL_TRIGGER_DP * density), 1f);
                              pullIndicator.setAlpha(progress);
                          }
                          break;
                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_CANCEL:
                          if (pullTracking && pullStartY >= 0) {
                              float dyFinal = event.getRawY() - pullStartY;
                              if (dyFinal > PULL_TRIGGER_DP * density) {
                                  vibrateShort();
                                  webView.reload();
                              }
                          }
                          if (pullIndicator != null) pullIndicator.setVisibility(View.GONE);
                          pullTracking = false;
                          pullStartY = -1f;
                          break;
                      default:
                          break;
                  }
              }

              // ======================================================================
              // 47: Soft (dismissible, non-forced) update banner
              // ======================================================================

              private void setupSoftUpdateBanner() {
                  LinearLayout banner = new LinearLayout(this);
                  banner.setOrientation(LinearLayout.HORIZONTAL);
                  banner.setGravity(Gravity.CENTER_VERTICAL);
                  banner.setBackgroundColor(Color.parseColor("#1d4ed8"));
                  float density = getResources().getDisplayMetrics().density;
                  banner.setPadding((int) (16 * density), (int) (10 * density), (int) (16 * density), (int) (10 * density));
                  banner.setVisibility(View.GONE);

                  TextView text = new TextView(this);
                  text.setText("አዲስ ስሪት አለ / New version available");
                  text.setTextColor(Color.WHITE);
                  text.setTextSize(13);
                  LinearLayout.LayoutParams textParams = new LinearLayout.LayoutParams(
                      0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f
                  );
                  banner.addView(text, textParams);

                  Button updateBtn = new Button(this);
                  updateBtn.setText("Update");
                  banner.addView(updateBtn);

                  Button dismissBtn = new Button(this);
                  dismissBtn.setText("✕");
                  dismissBtn.setOnClickListener(v -> {
                      vibrateShort();
                      banner.setVisibility(View.GONE);
                  });
                  banner.addView(dismissBtn);

                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  params.gravity = Gravity.BOTTOM;
                  addContentView(banner, params);
                  softUpdateBanner = banner;

                  updateBtn.setOnClickListener(v -> {
                      vibrateShort();
                      Object tag = banner.getTag();
                      String storeUrl = tag != null ? tag.toString()
                          : "https://play.google.com/store/apps/details?id=" + getPackageName();
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(storeUrl)));
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  });
              }

              private void showSoftUpdateBanner(String storeUrl) {
                  if (softUpdateBanner == null) return;
                  softUpdateBanner.setTag(storeUrl);
                  softUpdateBanner.setVisibility(View.VISIBLE);
              }
          }
          JAVAEOF

      - name: Update AndroidManifest (orientation, keyboard, permissions, deep link)
        run: |
          python3 << 'PYEOF'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          # 28-29: Force portrait + keyboard resize, only on MainActivity, only if not already present
          def add_attrs(match):
              block = match.group(0)
              if 'android:screenOrientation' in block:
                  return block
              return block.replace(
                  '<activity',
                  '<activity\n            android:screenOrientation="portrait"\n            android:windowSoftInputMode="adjustResize"',
                  1
              )

          content = re.sub(
              r'<activity[^>]*android:name="\.MainActivity"[^>]*>',
              add_attrs,
              content,
              count=1
          )

          # 30: VIBRATE permission
          if 'android.permission.VIBRATE' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.VIBRATE" />\n    <application',
                  1
              )

          # 45d: Biometric permissions for the app-lock feature. USE_BIOMETRIC covers
          # API 28+; USE_FINGERPRINT is the older pre-28 equivalent some OEM devices
          # still check. Both are normal-level (auto-granted, no runtime prompt).
          if 'android.permission.USE_BIOMETRIC' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application',
                  1
              )
          if 'android.permission.USE_FINGERPRINT' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.USE_FINGERPRINT" />\n    <application',
                  1
              )

          # 31: Deep link intent-filter (web+realvision://) + 48c: app-shortcuts
          # meta-data, both inserted only inside MainActivity's block, right before
          # its closing </activity> tag, and only once each.
          def add_deep_link(match):
              block = match.group(0)
              extra = ''
              if 'web+realvision' not in block:
                  extra += '''        <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="web+realvision" />
              </intent-filter>
          '''
              if 'android.app.shortcuts' not in block:
                  extra += '''        <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />
          '''
              if not extra:
                  return block
              return re.sub(r'</activity>\s*$', extra + '</activity>', block, count=1)

          content = re.sub(
              r'<activity[^>]*android:name="\.MainActivity".*?</activity>',
              add_deep_link,
              content,
              count=1,
              flags=re.DOTALL
          )

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Update styles.xml (status/nav bar colors)
        run: |
          python3 << 'PYEOF'
          import re

          path = "android/app/src/main/res/values/styles.xml"
          with open(path) as f:
              content = f.read()

          # Only inject into the base "AppTheme" style — never into splash-screen
          # or other derived styles, which is what was crashing the app on launch.
          def add_items(match):
              block = match.group(0)
              if 'android:statusBarColor' in block:
                  return block
              return re.sub(
                  r'</style>\s*$',
                  '    <item name="android:statusBarColor">#0b0518</item>\n'
                  '        <item name="android:navigationBarColor">#0b0518</item>\n'
                  '        <item name="android:windowBackground">#0b0518</item>\n'
                  '    </style>',
                  block
              )

          content = re.sub(
              r'<style name="AppTheme"[^>]*>.*?</style>',
              add_items,
              content,
              count=1,
              flags=re.DOTALL
          )

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      # Bug fix (debug-only APK): assembleDebug alone produced an artifact that:
      #   - is signed with the auto-generated Android debug key, which Google Play
      #     refuses to accept — there was no path from this workflow to a
      #     Play-Store-installable build at all;
      #   - ships with android:debuggable=true (set implicitly by the "debug"
      #     build type), which defeats the root/USB-debug/emulator warnings and
      #     FLAG_SECURE screenshot block added in MainActivity — a debuggable
      #     build can be attached to and inspected regardless of those checks;
      #   - has no ProGuard/R8 shrinking or obfuscation, so the compiled APK is
      #     trivial to decompile and read as close-to-source Java.
      # This step configures a real release build type instead: minifyEnabled +
      # shrinkResources (R8) and a signing config sourced from repo secrets, so
      # the same workflow produces a Play-Store-ready artifact. It requires four
      # repository secrets to be set beforehand (Settings -> Secrets and
      # variables -> Actions):
      #   ANDROID_KEYSTORE_BASE64  - `base64 -w0 your-release.jks` output
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      # If those secrets are not present (e.g. a contributor's fork, or a quick
      # smoke-test run), this step is skipped and the fallback debug step below
      # runs instead, so the workflow still succeeds end-to-end without them —
      # it just won't produce a store-ready artifact in that case.
      - name: Configure release signing + minification
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

          # Baseline ProGuard/R8 keep rules. Capacitor's own consumer rules
          # already cover its plugins, but the JavascriptInterface bridge added
          # in MainActivity.java (WebAppInterface / AndroidShare) is app code
          # R8 doesn't know is called from JS — without an explicit keep rule,
          # minification can rename or strip shareText(), which would silently
          # break the web page's AndroidShare.shareText(...) calls only in the
          # release build (never seen in the unobfuscated debug build).
          cat >> android/app/proguard-rules.pro << 'PROEOF'

          # Keep any @JavascriptInterface-annotated methods reachable from the
          # WebView's JS bridge — R8 has no static reference to these calls.
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.realvisionacademy.app.MainActivity$WebAppInterface { *; }
          PROEOF

          python3 << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          # Bug fix (signing block corrupted buildTypes.release): these two used to run
          # in the opposite order — signingConfigs inserted FIRST, then a regex looking
          # for "release {...}" to add minifyEnabled/shrinkResources/signingConfig to.
          # Since signingConfigs.release also contains a "release {...}" block, and it
          # now appeared earlier in the file than buildTypes.release, that regex (which
          # only takes the FIRST match) grabbed the wrong one — it rewrote
          # signingConfigs.release's contents into minifyEnabled/shrinkResources/etc,
          # which Gradle then rejected with "Could not find method minifyEnabled() ...
          # on SigningConfig" (and left buildTypes.release untouched, corrupting the
          # surrounding android{} block enough to also lose compileSdkVersion). Doing the
          # buildTypes.release rewrite FIRST — while it's still the only "release {...}"
          # block in the file — then inserting signingConfigs afterward, means the regex
          # can never match the wrong block.

          # Replace the default (unsigned, unminified) release build type with
          # one that shrinks/obfuscates and signs with the config below. Falls
          # back to inserting a release block if the template didn't ship one.
          #
          # Bug fix (wrong "release {...}" matched on a re-run): a bare
          # r'release\s*\{[^}]*\}' search matches the FIRST such block anywhere in
          # the file — fine the very first time this runs (buildTypes.release is
          # the only one that exists yet), but if this step ever runs a second
          # time against an already-patched file (e.g. a workflow re-run without
          # a fresh `npx cap add android` first), signingConfigs.release now
          # textually comes first and would get matched instead, corrupting it
          # exactly like the SigningConfig/minifyEnabled bug this fixes. Anchoring
          # the regex to require "buildTypes {" immediately before "release {"
          # makes it target the right block unconditionally, regardless of
          # whether signingConfigs has already been inserted or how many times
          # this step has run.
          release_type = '''release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }'''

          if re.search(r'buildTypes\s*\{\s*release\s*\{[^}]*\}', content, flags=re.DOTALL):
              content = re.sub(
                  r'(buildTypes\s*\{\s*)release\s*\{[^}]*\}',
                  r'\1' + release_type,
                  content,
                  count=1,
                  flags=re.DOTALL
              )
          else:
              content = re.sub(
                  r'(buildTypes\s*\{)',
                  r'\1\n            ' + release_type,
                  content,
                  count=1
              )

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''

          # Bug fix (block never inserted): checking bare 'signingConfigs' here used to
          # false-positive once the release_type edit above ran first — that edit's own
          # text contains "signingConfig signingConfigs.release", which already contains
          # the substring "signingConfigs", so this guard thought the block already
          # existed and silently skipped adding it. signingConfigs.release was then
          # referenced by buildTypes.release but never actually defined, which is exactly
          # what Gradle's "Could not get unknown property 'release' for SigningConfig
          # container" means. Checking for the block's opening brace specifically avoids
          # matching that unrelated reference.
          if 'signingConfigs {' not in content:
              content = re.sub(
                  r'(android\s*\{)',
                  r'\1' + signing_block,
                  content,
                  count=1
              )

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Build Release APK (signed + minified)
        if: ${{ steps.signing.outputs.has_secrets == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Fallback - Build Debug APK (no signing secrets configured)
        if: ${{ steps.signing.outputs.has_secrets != 'true' }}
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 and friends are not set as repo secrets — building an unsigned debug APK instead. This is NOT suitable for Play Store upload."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Release APK
        if: ${{ steps.signing.outputs.has_secrets == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: realvision-app-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK (fallback)
        if: ${{ steps.signing.outputs.has_secrets != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: realvision-app-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
