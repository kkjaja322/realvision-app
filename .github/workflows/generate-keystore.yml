name: Generate Release Keystore

# Run this ONCE, by hand, from the Actions tab (works fine from a phone browser
# or the GitHub mobile app). It builds a real Android release keystore for you
# and prints it as base64 text in the log, so you never need a computer,
# Termux, or keytool installed anywhere yourself.
on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Keystore password (write this down — you'll need it as ANDROID_KEYSTORE_PASSWORD)"
        required: true
      key_alias:
        description: "Key alias, e.g. realvision (you'll need it as ANDROID_KEY_ALIAS)"
        required: true
        default: "realvision"
      key_password:
        description: "Key password (you'll need it as ANDROID_KEY_PASSWORD — can be same as keystore password)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + print base64
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASS: ${{ inputs.key_password }}
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=RealVision Academy, OU=App, O=RealVision, L=AddisAbaba, ST=AA, C=ET"

          echo ""
          echo "=========================================================="
          echo "COPY EVERYTHING BETWEEN THE TWO LINES BELOW."
          echo "On your phone: open this step's '...' menu -> 'View raw logs'"
          echo "so it's plain text, then select-all + copy that block."
          echo "That text is your ANDROID_KEYSTORE_BASE64 secret value."
          echo "=========================================================="
          echo "-----BEGIN KEYSTORE BASE64-----"
          base64 -w0 release-key.jks
          echo ""
          echo "-----END KEYSTORE BASE64-----"
          echo "=========================================================="
          echo "Reminder — the OTHER 3 secrets are just what you typed"
          echo "in when you ran this workflow just now:"
          echo "  ANDROID_KEY_ALIAS      = $KEY_ALIAS"
          echo "  (keystore/key passwords are NOT re-printed here on purpose —"
          echo "   use exactly what you entered in the 'Run workflow' form)"
          echo "=========================================================="

      # Also uploaded as a downloadable backup file, in case you ever need
      # the raw .jks itself (e.g. to switch to a different CI tool later).
      # Keep it somewhere safe — losing it means you can never update this
      # app on the Play Store again under the same listing.
      - name: Upload keystore file as backup
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: release-key.jks
